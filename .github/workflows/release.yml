# Cut prebuilt `thegn` binaries on a version tag.
#
# Trigger: push a `v*` tag (e.g. `v0.1.0-alpha.1`). Builds the `thegn` binary for
# the supported targets and attaches per-target archives, checksums, provenance,
# rendered manager metadata, and standalone Linux packages to a GitHub Release.
# External manager repositories are a separate protected manual operation.
# Uses taiki-e/upload-rust-binary-action, whose archive
# naming (`thegn-<tag>-<target>.{tar.gz,zip}`) matches the `[package.metadata.
# binstall]` pkg-url in crates/thegn-host/Cargo.toml, so a future `cargo binstall`
# (once the crates are published) resolves the same assets.
#
# The workspace's canonical build is Nix (`nix build .#default`); this workflow is
# the cross-platform binary path for users who don't run Nix. The C deps (bundled
# sqlite + vendored libgit2) build from source on every runner, so no system libs
# are required beyond a C toolchain (present on the GitHub runners).
#
# MATRIX SCOPE. Linux (gnu + musl) plus aarch64-apple-darwin. The darwin leg was
# removed at v0.1.0-alpha.1 because `thegn-host` had never been compiled for it;
# it now builds, tests and runs on Apple silicon, and the `macos` CI job is
# runnable again on a lean dev shell (opt-in per run, `extras: true`), so the
# target is no longer unproven — though nothing is enforced until someone
# dispatches it. x86_64-apple-darwin stays out: the pinned nixpkgs dropped it
# and no Intel Mac is available to prove it. windows-msvc also stays out — that
# job has still never executed; see openspec/changes/add-windows-native-compile.
#
# GATEKEEPER. These archives are UNSIGNED. A macOS binary downloaded through a
# browser carries `com.apple.quarantine` and is refused on first launch until the
# user clears it — see RELEASING.md, which documents the two supported paths
# (Homebrew, which does not quarantine formula downloads, and the locally
# generated `thegn.app`) and what notarization would cost.
#
# Shipping unbuilt targets means `fail-fast: false` silently produces a partial
# asset set — so add a target here only once its CI job is green.
name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0-alpha.1)"
        required: true
        type: string
      operation:
        description: "Build a draft, or publish generated metadata after the draft is published"
        required: true
        type: choice
        default: build
        options:
          - build
          - publish-external
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}-${{ inputs.operation || 'build' }}
  cancel-in-progress: false
jobs:
  # Resolve one policy-valid tag to an immutable commit before any build job
  # checks out release content. This job runs only pinned actions and inline
  # policy code; the policy/version source is checked out from protected main.
  admit:
    if: github.event_name == 'push' || inputs.operation == 'build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      tag_object: ${{ steps.resolve.outputs.tag_object }}
      workflow_sha: ${{ steps.resolve.outputs.workflow_sha }}
    steps:
      - name: Validate requested tag syntax
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::invalid release tag"
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Resolve and admit immutable release commit
        id: resolve
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "refs/tags/$TAG:refs/tags/$TAG"
          sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          tag_object="$(git rev-parse --verify "refs/tags/$TAG")"
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::release commit is not descended from main"
            exit 1
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  # Create the draft before the read-only build legs start. The trusted upload
  # broker publishes verified artifacts here after every build leg succeeds.
  # Draft so a maintainer writes notes by hand before publishing (RELEASING.md
  # step 4); no `changelog:` input — notes are pasted manually.
  #
  # Re-dispatching a build resumes an existing draft without changing its
  # notes or assets, and creates a draft only when the tag has no release.
  # A published release refuses the build and is never deleted.
  create-release:
    if: github.event_name == 'push' || inputs.operation == 'build'
    needs: admit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release only if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.admit.outputs.tag }}
        run: |
          set -euo pipefail
          rows="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | [.tag_name, (.draft | tostring)] | @tsv')"
          matches="$(printf '%s\n' "$rows" | awk -F '\t' -v tag="$TAG" '$1 == tag')"
          if [ -n "$matches" ]; then
            count="$(printf '%s\n' "$matches" | awk 'END {print NR}')"
          else
            count=0
          fi
          if [ "$count" -eq 0 ]; then
            create_args=("$TAG" --draft --verify-tag --title "$TAG" --notes "")
            if [[ "$TAG" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          elif [ "$count" -gt 1 ]; then
            echo "::error::found $count releases for tag $TAG; refusing to choose one"
            exit 1
          else
            draft="$(printf '%s\n' "$matches" | awk -F '\t' 'NR == 1 {print $2}')"
            if [ "$draft" = true ]; then
              echo "::notice::resuming the existing draft release for $TAG"
            else
              echo "::error::release $TAG is already published; refusing to recreate it (see RELEASING.md)"
              exit 1
            fi
          fi
  # The matrix builds and stages archives with read-only permissions. The upload
  # broker below accepts only the complete, verified artifact set.
  build:
    if: github.event_name == 'push' || inputs.operation == 'build'
    name: ${{ matrix.target }}
    needs: [admit, create-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # Apple silicon is a native build; darwin cannot be cross-compiled from Linux.
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false
      - name: Verify tag still names the admitted commit
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          ADMITTED_SHA: ${{ needs.admit.outputs.sha }}
          ADMITTED_TAG_OBJECT: ${{ needs.admit.outputs.tag_object }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          tag_object="$(awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}' <<< "$remote")"
          peeled="$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}' <<< "$remote")"
          [ -n "$tag_object" ] || { echo "::error::release tag disappeared"; exit 1; }
          [ "$tag_object" = "$ADMITTED_TAG_OBJECT" ] \
            && [ "${peeled:-$tag_object}" = "$ADMITTED_SHA" ] || {
            echo "::error::release tag moved after admission"
            exit 1
          }
      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - id: upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: thegn
          target: ${{ matrix.target }}
          # The binary lives in the thegn-host crate.
          manifest-path: crates/thegn-host/Cargo.toml
          # Release binaries include the optional call-home transport (THE-672).
          features: iroh
          archive: thegn-$tag-$target
          # Both licenses and the README are included. Keep the binary at the archive
          # root: the Homebrew formula installs it with `bin.install "thegn"`.
          include: LICENSE-MIT,LICENSE-APACHE,README.md
          checksum: sha256
          # Build against the committed Cargo.lock.
          locked: true
          ref: refs/tags/${{ needs.admit.outputs.tag }}
          dry-run: true
          dry-run-intended: true
      - name: Stage archive and verified checksum
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="thegn-$TAG-$TARGET.tar.gz"
          checksum="thegn-$TAG-$TARGET.sha256"
          [ -f "$archive" ] || { echo "::error::missing archive $archive"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            fresh="$(sha256sum "$archive" | awk '{print $1}')"
          else
            fresh="$(shasum -a 256 "$archive" | awk '{print $1}')"
          fi
          if [ -f "$checksum" ]; then
            read -r recorded named extra < "$checksum" || true
            [[ "$recorded" =~ ^[a-f0-9]{64}$ ]] \
              && { [ -z "${named:-}" ] || [ "$named" = "$archive" ]; } \
              && [ -z "${extra:-}" ] && [ "$recorded" = "$fresh" ] || {
              echo "::error::checksum mismatch or malformed checksum for $archive"
              exit 1
            }
          fi
          printf '%s  %s\n' "$fresh" "$archive" > "$checksum"
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp -- "$archive" "$checksum" "$out/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
  # The broker has publication and attestation authority but runs no repository
  # build code. It publishes only artifacts that match the explicit allowlist.
  upload:
    if: github.event_name == 'push' || inputs.operation == 'build'
    needs: [admit, create-release, build, completions]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      asset_digests: ${{ steps.record.outputs.asset_digests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - name: Verify exact asset set and checksums
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          TARGETS: x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-apple-darwin
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          expected=()
          for target in $TARGETS; do
            expected+=("thegn-$TAG-$target.tar.gz" "thegn-$TAG-$target.sha256")
          done
          expected+=("thegn-$TAG-completions.tar.gz" "thegn-$TAG-completions.tar.gz.sha256")
          mapfile -t actual < <(find "$release" -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${#actual[@]}" -ne "${#expected_sorted[@]}" ] \
            || [ "${actual[*]}" != "${expected_sorted[*]}" ]; then
            echo "::error::downloaded release artifact set is incomplete or contains unexpected files"
            printf 'Expected: %s\n' "${expected_sorted[@]}"
            printf 'Found: %s\n' "${actual[@]}"
            exit 1
          fi
          for archive in "${expected[@]}"; do
            [[ "$archive" == *.tar.gz ]] || continue
            if [[ "$archive" == *-completions.tar.gz ]]; then
              checksum="$archive.sha256"
            else
              checksum="${archive%.tar.gz}.sha256"
            fi
            [ -f "$release/$archive" ] && [ -f "$release/$checksum" ] || {
              echo "::error::missing archive/checksum pair for $archive"
              exit 1
            }
            read -r recorded named extra < "$release/$checksum" || true
            fresh="$(sha256sum "$release/$archive" | awk '{print $1}')"
            [[ "$recorded" =~ ^[a-f0-9]{64}$ ]] \
              && [ "$named" = "$archive" ] && [ -z "${extra:-}" ] \
              && [ "$recorded" = "$fresh" ] || {
              echo "::error::checksum mismatch or malformed checksum for $archive"
              exit 1
            }
          done
      - name: Verify tag still names the admitted commit
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          ADMITTED_SHA: ${{ needs.admit.outputs.sha }}
          ADMITTED_TAG_OBJECT: ${{ needs.admit.outputs.tag_object }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          tag_object="$(awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}' <<< "$remote")"
          peeled="$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}' <<< "$remote")"
          [ -n "$tag_object" ] || { echo "::error::release tag disappeared"; exit 1; }
          [ "$tag_object" = "$ADMITTED_TAG_OBJECT" ] \
            && [ "${peeled:-$tag_object}" = "$ADMITTED_SHA" ] || {
            echo "::error::release tag moved after admission"
            exit 1
          }
      - name: Attest release archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/thegn-${{ needs.admit.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/release/thegn-${{ needs.admit.outputs.tag }}-x86_64-unknown-linux-musl.tar.gz
            ${{ runner.temp }}/release/thegn-${{ needs.admit.outputs.tag }}-aarch64-apple-darwin.tar.gz
            ${{ runner.temp }}/release/thegn-${{ needs.admit.outputs.tag }}-completions.tar.gz
      - name: Upload verified release assets
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          assets=("$release"/thegn-"$TAG"-*.tar.gz "$release"/thegn-"$TAG"-*.sha256)
          gh release upload "$TAG" "${assets[@]}" --clobber
      - name: Write and publish release record
        id: record
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          TAG_OBJECT: ${{ needs.admit.outputs.tag_object }}
          COMMIT: ${{ needs.admit.outputs.sha }}
          WORKFLOW_SHA: ${{ needs.admit.outputs.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/release"
          assets_json="$RUNNER_TEMP/release-assets.jsonl"
          : > "$assets_json"
          for asset in "$release"/thegn-"$TAG"-*.tar.gz "$release"/thegn-"$TAG"-*.sha256; do
            [ -f "$asset" ] || continue
            name="${asset##*/}"
            digest="$(sha256sum "$asset" | awk '{print $1}')"
            jq -cn --arg name "$name" --arg sha256 "$digest" \
              '{name: $name, sha256: $sha256}' >> "$assets_json"
          done
          jq -n \
            --arg tag "$TAG" \
            --arg tag_object "$TAG_OBJECT" \
            --arg commit "$COMMIT" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --arg run_id "$RUN_ID" \
            --slurpfile assets "$assets_json" \
            '{tag: $tag, tag_object: $tag_object, commit: $commit,
              workflow_sha: $workflow_sha, run_id: $run_id,
              assets: ($assets | sort_by(.name))}' \
            > "$release/thegn-$TAG-release.json"
          : > "$RUNNER_TEMP/trusted-asset-digests.jsonl"
          for asset in "$release"/thegn-"$TAG"-*.tar.gz "$release"/thegn-"$TAG"-*.sha256 \
            "$release/thegn-$TAG-release.json"; do
            [ -f "$asset" ] || {
              echo "::error::expected release asset file is missing: $asset"
              exit 1
            }
            name="${asset##*/}"
            digest="$(sha256sum "$asset" | awk '{print $1}')"
            jq -cn --arg name "$name" --arg sha256 "$digest" \
              '{name: $name, sha256: $sha256}' >> "$RUNNER_TEMP/trusted-asset-digests.jsonl"
          done
          asset_digests="$(jq -cs 'map({(.name): .sha256}) | add' \
            "$RUNNER_TEMP/trusted-asset-digests.jsonl")"
          [ -n "$asset_digests" ] && [ "$asset_digests" != "null" ] || {
            echo "::error::could not compute trusted release asset digests"
            exit 1
          }
          echo "asset_digests=$asset_digests" >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" "$release/thegn-$TAG-release.json" --clobber
  # Read-only completion build ships ONCE, as a single arch-independent artifact, rather than
  # riding inside each per-target archive. Three reasons:
  #   - the CLI tree has no `#[cfg]`-gated `Command` variants, so every target
  #     emits byte-identical scripts — per-target copies would be pure duplication;
  #   - upload-rust-binary-action's `include:` only accepts files that already
  #     exist in the repo, and these are generated at build time;
  #   - the musl and darwin legs cannot always execute the binary they just
  #     built, and the generator has to run to produce a script.
  # Nix installs its own copies (nix/package.nix), so this artifact serves the
  # tarball / cargo-binstall path. It runs in parallel with the read-only matrix.
  completions:
    if: github.event_name == 'push' || inputs.operation == 'build'
    name: completions
    needs: [admit, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false
      # Same toolchain pin the ci.yml jobs use, rather than whatever rustup
      # version the runner image happens to ship.
      # Pinned by SHA, so the toolchain can no longer be inferred from the ref
      # name (`@stable`) and must be named explicitly.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Build thegn
        run: cargo build --release --locked -p thegn-host --bin thegn
      - name: Generate completions
        env:
          TAG: ${{ needs.admit.outputs.tag }}
        run: |
          set -euo pipefail
          # `thegn completions` reaches the generator via run_subcommand, which
          # loads the layered config and opens the SQLite state DB on the way.
          # Keep that off the runner's real HOME.
          scratch="$(mktemp -d)"
          export HOME="$scratch"
          export XDG_STATE_HOME="$scratch/state"
          export XDG_CONFIG_HOME="$scratch/config"
          export THEGN_NO_MIGRATE=1
          unset THEGN_LOG
          # The generator names the script from argv[0], so `tg`'s script comes
          # from the same binary invoked as `tg`.
          cp target/release/thegn "$scratch/thegn"
          ln -s thegn "$scratch/tg"
          stage="$scratch/stage"
          mkdir -p "$stage/share/bash-completion/completions" \
                   "$stage/share/zsh/site-functions" \
                   "$stage/share/fish/vendor_completions.d" \
                   "$stage/elvish" "$stage/powershell"
          for name in thegn tg; do
            # The three shells with a packaging convention go where a packager
            # wants them; elvish and PowerShell have none, so they get a plain
            # directory each and are installed by hand.
            "$scratch/$name" completions bash \
              > "$stage/share/bash-completion/completions/$name"
            "$scratch/$name" completions zsh \
              > "$stage/share/zsh/site-functions/_$name"
            "$scratch/$name" completions fish \
              > "$stage/share/fish/vendor_completions.d/$name.fish"
            "$scratch/$name" completions elvish > "$stage/elvish/$name.elv"
            "$scratch/$name" completions powershell > "$stage/powershell/_$name.ps1"
          done
          tar -czf "thegn-$TAG-completions.tar.gz" -C "$stage" .
          sha256sum "thegn-$TAG-completions.tar.gz" \
            > "thegn-$TAG-completions.tar.gz.sha256"
      - name: Stage completion artifacts
        env:
          TAG: ${{ needs.admit.outputs.tag }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          cp -- "thegn-$TAG-completions.tar.gz" \
            "thegn-$TAG-completions.tar.gz.sha256" "$out/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-completions
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
  package:
    if: github.event_name == 'push' || inputs.operation == 'build'
    needs: [admit, upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    outputs:
      package_digests: ${{ steps.packages.outputs.package_digests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.admit.outputs.sha }}
      - name: Prepare trusted workflow action
        env:
          TRUSTED_WORKFLOW_SHA: ${{ needs.admit.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TRUSTED_WORKFLOW_SHA"
          rm -rf .github/actions/ci-setup
          mkdir -p .github/actions/ci-setup
          git archive "$TRUSTED_WORKFLOW_SHA" .github/actions/ci-setup \
            | tar -xf -
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
          cache-lane: release-package
      - name: Resolve release tag
        env:
          REQUESTED_TAG: ${{ needs.admit.outputs.tag }}
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          echo "TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
          echo "PACKAGE_ROOT=$package_root" >> "$GITHUB_ENV"
          mkdir -p "$package_root/assets" "$package_root/rendered" \
            "$package_root/package" "$package_root/release-assets"
      - name: Download this tag's source assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir "$PACKAGE_ROOT/assets" \
            --pattern "thegn-$TAG-*.tar.gz" \
            --pattern "thegn-$TAG-*.sha256"
      - name: Verify assets against the upload broker's digests
        env:
          TRUSTED_DIGESTS: ${{ needs.upload.outputs.asset_digests }}
        run: |
          set -euo pipefail
          [ -n "$TRUSTED_DIGESTS" ] || {
            echo "::error::upload broker published no asset digests"
            exit 1
          }
          printf '%s' "$TRUSTED_DIGESTS" > "$PACKAGE_ROOT/trusted-digests.json"
          python3 packaging/release.py verify-digests \
            --tag "$TAG" \
            --assets-dir "$PACKAGE_ROOT/assets" \
            --trusted-digests "$PACKAGE_ROOT/trusted-digests.json"
      - name: Verify archive provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$PACKAGE_ROOT/assets"/thegn-"$TAG"-*.tar.gz)
          [ "${#archives[@]}" -gt 0 ] || { echo "::error::no release archives to verify"; exit 1; }
          for archive in "${archives[@]}"; do
            verification="$(gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --format json)"
            if ! jq -e \
              --arg run_uri_prefix "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/" \
              'type == "array" and length > 0 and all(.[];
                ((.verificationResult.signature.certificate.runInvocationURI // "")
                  | startswith($run_uri_prefix)))' \
              <<< "$verification" >/dev/null; then
              echo "::error::archive attestation is not bound to this workflow run"
              exit 1
            fi
          done
      - name: Validate all active inputs and render metadata
        run: |
          set -euo pipefail
          python3 packaging/release.py validate \
            --tag "$TAG" \
            --assets-dir "$PACKAGE_ROOT/assets" \
            | tee "$PACKAGE_ROOT/validation.txt"
          python3 packaging/release.py render \
            --tag "$TAG" \
            --assets-dir "$PACKAGE_ROOT/assets" \
            --output-dir "$PACKAGE_ROOT/rendered" \
            | tee "$PACKAGE_ROOT/rendered.txt"
      - name: Build standalone deb and rpm packages
        run: |
          set -euo pipefail
          python3 packaging/release.py stage \
            --tag "$TAG" \
            --assets-dir "$PACKAGE_ROOT/assets" \
            --target x86_64-unknown-linux-gnu \
            --trusted-digests "$PACKAGE_ROOT/trusted-digests.json" \
            --output-dir "$PACKAGE_ROOT/package/stage" \
            --digests-out "$PACKAGE_ROOT/stage-digests.json"
          # validate already proved this tag is exactly v<workspace version>.
          version="${TAG#v}"
          nfpm_store="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#nfpm)"
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          (
            cd "$PACKAGE_ROOT/package"
            "$nfpm_store/bin/nfpm" package \
              --config "$PACKAGE_ROOT/rendered/nfpm/thegn-deb.yaml" \
              --packager deb \
              --target "$PACKAGE_ROOT/release-assets/thegn_${version}_amd64.deb"
            "$nfpm_store/bin/nfpm" package \
              --config "$PACKAGE_ROOT/rendered/nfpm/thegn-rpm.yaml" \
              --packager rpm \
              --target "$PACKAGE_ROOT/release-assets/thegn-${version}-1.x86_64.rpm"
          )
      - name: Verify packaged payload against staged bytes
        run: |
          set -euo pipefail
          dpkg_store="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#dpkg)"
          rpm_store="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#rpm)"
          cpio_store="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#cpio)"
          version="${TAG#v}"
          mkdir -p "$PACKAGE_ROOT/payload/deb" "$PACKAGE_ROOT/payload/rpm"
          "$dpkg_store/bin/dpkg-deb" -x \
            "$PACKAGE_ROOT/release-assets/thegn_${version}_amd64.deb" \
            "$PACKAGE_ROOT/payload/deb"
          "$rpm_store/bin/rpm2cpio" \
            "$PACKAGE_ROOT/release-assets/thegn-${version}-1.x86_64.rpm" \
            | (cd "$PACKAGE_ROOT/payload/rpm" && \
              "$cpio_store/bin/cpio" -idm --no-absolute-filenames --quiet)
          python3 packaging/release.py verify-payload \
            --tag "$TAG" \
            --staged-digests "$PACKAGE_ROOT/stage-digests.json" \
            --payload-root "$PACKAGE_ROOT/payload/deb" \
            --label deb
          python3 packaging/release.py verify-payload \
            --tag "$TAG" \
            --staged-digests "$PACKAGE_ROOT/stage-digests.json" \
            --payload-root "$PACKAGE_ROOT/payload/rpm" \
            --label rpm
      - name: Stage rendered metadata
        run: |
          set -euo pipefail
          cp "$PACKAGE_ROOT/rendered/homebrew/thegn.rb" \
            "$PACKAGE_ROOT/release-assets/thegn-$TAG-homebrew.rb"
          cp "$PACKAGE_ROOT/rendered/aur/PKGBUILD" \
            "$PACKAGE_ROOT/release-assets/thegn-$TAG-PKGBUILD"
          cp "$PACKAGE_ROOT/rendered/nfpm/thegn-deb.yaml" \
            "$PACKAGE_ROOT/release-assets/thegn-$TAG-deb.nfpm.yaml"
          cp "$PACKAGE_ROOT/rendered/nfpm/thegn-rpm.yaml" \
            "$PACKAGE_ROOT/release-assets/thegn-$TAG-rpm.nfpm.yaml"
      - name: Upload packages and rendered metadata
        id: packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADMITTED_SHA: ${{ needs.admit.outputs.sha }}
          ADMITTED_TAG_OBJECT: ${{ needs.admit.outputs.tag_object }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          tag_object="$(awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}' <<< "$remote")"
          peeled="$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}' <<< "$remote")"
          [ -n "$tag_object" ] && [ "$tag_object" = "$ADMITTED_TAG_OBJECT" ] \
            && [ "${peeled:-$tag_object}" = "$ADMITTED_SHA" ] || {
            echo "::error::release tag moved after admission"
            exit 1
          }
          # This directory contains no source archive, so --clobber cannot
          # retract or overwrite any matrix output.
          : > "$PACKAGE_ROOT/package-digests.jsonl"
          for asset in "$PACKAGE_ROOT/release-assets/"*; do
            [ -f "$asset" ] || {
              echo "::error::expected package asset file is missing: $asset"
              exit 1
            }
            name="${asset##*/}"
            digest="$(sha256sum "$asset" | awk '{print $1}')"
            jq -cn --arg name "$name" --arg sha256 "$digest" \
              '{name: $name, sha256: $sha256}' >> "$PACKAGE_ROOT/package-digests.jsonl"
          done
          package_digests="$(jq -cs 'map({(.name): .sha256}) | add' \
            "$PACKAGE_ROOT/package-digests.jsonl")"
          [ -n "$package_digests" ] && [ "$package_digests" != "null" ] || {
            echo "::error::package job produced no trusted asset digests"
            exit 1
          }
          echo "package_digests=$package_digests" >> "$GITHUB_OUTPUT"
          gh release upload "$TAG" "$PACKAGE_ROOT/release-assets/"* --clobber
      - name: Summarize package outputs
        env:
          PUBLICATION_ENABLED: ${{ vars.PACKAGE_PUBLICATION_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          {
            echo "## Package artifacts for $TAG"
            echo
            echo "Outputs:"
            while IFS= read -r path; do
              echo "- \`$(basename "$path")\`"
            done < <(find "$PACKAGE_ROOT/release-assets" -maxdepth 1 -type f | sort)
            echo
            echo "Validated target/checksum mapping:"
            echo '```text'
            sed 's/^/  /' "$PACKAGE_ROOT/validation.txt"
            echo '```'
            echo
            echo "Every archive's attestation matched this signing run and was bound to"
            echo "this workflow run before packaging."
            echo '```sh'
            echo "gh attestation verify thegn-$TAG-<target>.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "External publication enabled: \`$PUBLICATION_ENABLED\`"
          } >> "$GITHUB_STEP_SUMMARY"
  verify-manifest:
    if: github.event_name == 'push' || inputs.operation == 'build'
    needs: [admit, upload, completions, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.admit.outputs.sha }}
          persist-credentials: false
      - name: Download every draft asset
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/verify.XXXXXX")"
          echo "VERIFY_ROOT=$root" >> "$GITHUB_ENV"
          mkdir -p "$root/assets" "$RUNNER_TEMP/manifest"
          gh release download "$TAG" --dir "$root/assets"
      - name: Verify archive provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.admit.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$VERIFY_ROOT/assets/thegn-$TAG-"*.tar.gz)
          [ "${#archives[@]}" -gt 0 ] || { echo "::error::no release archives to verify"; exit 1; }
          for archive in "${archives[@]}"; do
            verification="$(gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners \
              --format json)"
            if ! jq -e \
              --arg run_uri_prefix "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/" \
              'type == "array" and length > 0 and all(.[];
                ((.verificationResult.signature.certificate.runInvocationURI // "")
                  | startswith($run_uri_prefix)))' \
              <<< "$verification" >/dev/null; then
              echo "::error::archive attestation is not bound to this workflow run"
              exit 1
            fi
          done
      - name: Build the release manifest
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          ADMITTED_SHA: ${{ needs.admit.outputs.sha }}
          UPLOAD_DIGESTS: ${{ needs.upload.outputs.asset_digests }}
          PACKAGE_DIGESTS: ${{ needs.package.outputs.package_digests }}
        run: |
          set -euo pipefail
          [ -n "$UPLOAD_DIGESTS" ] || {
            echo "::error::upload job published no asset digests"
            exit 1
          }
          [ -n "$PACKAGE_DIGESTS" ] || {
            echo "::error::package job published no asset digests"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/manifest-input"
          printf '%s' "$UPLOAD_DIGESTS" > "$RUNNER_TEMP/manifest-input/upload.json"
          printf '%s' "$PACKAGE_DIGESTS" > "$RUNNER_TEMP/manifest-input/package.json"
          python3 packaging/release.py manifest \
            --tag "$TAG" \
            --assets-dir "$VERIFY_ROOT/assets" \
            --record "$VERIFY_ROOT/assets/thegn-$TAG-release.json" \
            --commit "$ADMITTED_SHA" \
            --trusted-digests "$RUNNER_TEMP/manifest-input/upload.json" \
            --trusted-digests "$RUNNER_TEMP/manifest-input/package.json" \
            --output "$RUNNER_TEMP/manifest/thegn-$TAG-manifest.json"
      - name: Verify tag still names the admitted commit
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          ADMITTED_SHA: ${{ needs.admit.outputs.sha }}
          ADMITTED_TAG_OBJECT: ${{ needs.admit.outputs.tag_object }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          tag_object="$(awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}' <<< "$remote")"
          peeled="$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}' <<< "$remote")"
          [ -n "$tag_object" ] || { echo "::error::release tag disappeared"; exit 1; }
          [ "$tag_object" = "$ADMITTED_TAG_OBJECT" ] \
            && [ "${peeled:-$tag_object}" = "$ADMITTED_SHA" ] || {
            echo "::error::release tag moved after admission"
            exit 1
          }
      - name: Attest release manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/manifest/thegn-${{ needs.admit.outputs.tag }}-manifest.json
      - name: Upload release manifest
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/manifest/thegn-$TAG-manifest.json"
          gh release upload "$TAG" "$manifest" --clobber
          asset_count="$(jq '.assets | length' "$manifest")"
          echo "Verified and attached $asset_count release assets in the manifest for $TAG." >> "$GITHUB_STEP_SUMMARY"
  # Publication is deliberately a separate manual operation. It cannot reach
  # create-release or mutate release assets. A credential-free worker renders
  # AUR metadata before isolated, separately protected publishers receive keys.
  aur-srcinfo:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-external'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a main-branch dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != refs/heads/main ]; then
            echo "::error::External publication must be dispatched from the main branch."
            exit 1
          fi
      - name: Validate release tag syntax
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::invalid release tag"
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: Check AUR metadata generation enablement
        id: srcinfo
        env:
          ENABLED: ${{ vars.PACKAGE_PUBLICATION_ENABLED }}
        run: |
          if [ "$ENABLED" != true ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "AUR metadata generation skipped; PACKAGE_PUBLICATION_ENABLED is not true."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Download PKGBUILD from published release
        if: steps.srcinfo.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            echo "::error::Publish the draft release before external publication."
            exit 1
          fi
          source_root="$(mktemp -d "$RUNNER_TEMP/srcinfo.XXXXXX")"
          echo "SOURCE_ROOT=$source_root" >> "$GITHUB_ENV"
          gh release download "$TAG" --dir "$source_root" \
            --pattern "thegn-$TAG-PKGBUILD"
      - name: Generate and bound AUR source metadata
        if: steps.srcinfo.outputs.enabled == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          work_root="$(mktemp -d "$RUNNER_TEMP/srcinfo-work.XXXXXX")"
          home_root="$(mktemp -d "$RUNNER_TEMP/srcinfo-home.XXXXXX")"
          cp "$SOURCE_ROOT/thegn-$TAG-PKGBUILD" "$work_root/PKGBUILD"
          pacman_store="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#pacman)"
          (
            cd "$work_root"
            env -i PATH="$pacman_store/bin:/usr/bin:/bin" HOME="$home_root" \
              makepkg --printsrcinfo > .SRCINFO
          )
          srcinfo_size="$(wc -c < "$work_root/.SRCINFO")"
          if [ "$srcinfo_size" -eq 0 ] || [ "$srcinfo_size" -gt 65536 ]; then
            echo "::error::.SRCINFO must be nonempty and at most 64 KiB."
            exit 1
          fi
          sha256sum "$work_root/PKGBUILD" "$work_root/.SRCINFO" | tee "$RUNNER_TEMP/aur-metadata-sha256.txt"
          echo "AUR metadata SHA-256 checksums:" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/aur-metadata-sha256.txt" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/aur-artifact"
          cp "$work_root/PKGBUILD" "$work_root/.SRCINFO" "$RUNNER_TEMP/aur-artifact/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.srcinfo.outputs.enabled == 'true'
        with:
          name: aur-metadata
          path: ${{ runner.temp }}/aur-artifact/
          if-no-files-found: error
          include-hidden-files: true
      - name: Remove temporary source files
        if: always()
        run: |
          set -euo pipefail
          for path in "${SOURCE_ROOT:-}" "$RUNNER_TEMP"/srcinfo-work.* "$RUNNER_TEMP"/srcinfo-home.* \
            "$RUNNER_TEMP/aur-artifact" "$RUNNER_TEMP/aur-metadata-sha256.txt"; do
            if [ -n "$path" ] && [[ "$path" == "$RUNNER_TEMP/"* ]]; then
              rm -rf "$path"
            fi
          done
  publish-homebrew:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-external'
    runs-on: ubuntu-latest
    environment: package-publication-homebrew
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Require a main-branch dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != refs/heads/main ]; then
            echo "::error::External publication must be dispatched from the main branch."
            exit 1
          fi
      - name: Validate release tag syntax
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::invalid release tag"
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
          cache-lane: release-publication
      - name: Check Homebrew publication enablement
        id: publication
        env:
          ENABLED: ${{ vars.PACKAGE_PUBLICATION_ENABLED }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ "$ENABLED" = true ] || missing+=("PACKAGE_PUBLICATION_ENABLED=true")
          [[ "$TAP_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
            || missing+=("HOMEBREW_TAP_REPOSITORY=<owner>/homebrew-tap")
          [ -n "$TAP_DEPLOY_KEY" ] || missing+=("HOMEBREW_TAP_DEPLOY_KEY")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Homebrew publication pending::Nothing was pushed; missing: ${missing[*]}"
            checklist="Setup checklist: (1) create public homebrew-tap;"
            checklist+=" (2) add its write-scoped deploy key to package-publication-homebrew"
            checklist+=" with a required reviewer; (3) set HOMEBREW_TAP_REPOSITORY;"
            checklist+=" (4) set PACKAGE_PUBLICATION_ENABLED=true."
            echo "::warning::$checklist"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Download formula from published release
        if: steps.publication.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            echo "::error::Publish the draft release before external publication."
            exit 1
          fi
          publish_root="$(mktemp -d "$RUNNER_TEMP/publish.XXXXXX")"
          echo "PUBLISH_ROOT=$publish_root" >> "$GITHUB_ENV"
          mkdir -p "$publish_root/metadata" "$publish_root/keys"
          gh release download "$TAG" --dir "$publish_root/metadata" \
            --pattern "thegn-$TAG-homebrew.rb"
          manifest="$publish_root/metadata/thegn-$TAG-manifest.json"
          if ! gh release download "$TAG" --dir "$publish_root/metadata" \
            --pattern "thegn-$TAG-manifest.json" || [ ! -f "$manifest" ]; then
            echo "::error::release manifest missing: run the build to completion (verify-manifest) before publishing"
            exit 1
          fi
          if ! gh attestation verify "$manifest" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --deny-self-hosted-runners; then
            echo "::error::release manifest attestation did not verify"
            exit 1
          fi
          if [ "$(jq -r '.tag' "$manifest")" != "$TAG" ]; then
            echo "::error::release manifest tag does not match"
            exit 1
          fi
          formula="thegn-$TAG-homebrew.rb"
          manifest_sha="$(jq -r --arg n "$formula" \
            '[.assets[] | select(.name == $n) | .sha256] | if length == 1 then .[0] else "" end' \
            "$manifest")"
          if [[ ! "$manifest_sha" =~ ^[a-f0-9]{64}$ ]] \
            || [ "$(sha256sum "$publish_root/metadata/$formula" | cut -d ' ' -f 1)" != "$manifest_sha" ]; then
            echo "::error::$formula does not match the release manifest"
            exit 1
          fi
      - name: Materialize Homebrew deploy key
        if: steps.publication.outputs.ready == 'true'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$PUBLISH_ROOT/keys/homebrew"
          chmod 600 "$PUBLISH_ROOT/keys/homebrew"
      - name: Publish Homebrew formula
        id: publish
        if: steps.publication.outputs.ready == 'true'
        env:
          TAG: ${{ inputs.tag }}
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          set -euo pipefail
          known_hosts="$GITHUB_WORKSPACE/.github/known_hosts"
          ssh_options="-o UserKnownHostsFile=\"$known_hosts\""
          ssh_options+=" -o GlobalKnownHostsFile=/dev/null"
          ssh_options+=" -o StrictHostKeyChecking=yes"
          ssh_options+=" -o HostKeyAlgorithms=ssh-ed25519"
          tap_ssh="ssh -i $PUBLISH_ROOT/keys/homebrew -o IdentitiesOnly=yes $ssh_options"
          GIT_SSH_COMMAND="$tap_ssh" git clone \
            "git@github.com:$TAP_REPOSITORY.git" "$PUBLISH_ROOT/tap"
          branch="$(git -C "$PUBLISH_ROOT/tap" symbolic-ref --short HEAD)"
          old="$(git -C "$PUBLISH_ROOT/tap" rev-parse --verify -q HEAD || true)"
          {
            printf 'old=%s\n' "$old"
            printf 'branch=%s\n' "$branch"
            printf 'observed=unknown\n'
          } >> "$GITHUB_OUTPUT"
          mkdir -p "$PUBLISH_ROOT/tap/Formula"
          cp "$PUBLISH_ROOT/metadata/thegn-$TAG-homebrew.rb" \
            "$PUBLISH_ROOT/tap/Formula/thegn.rb"
          git -C "$PUBLISH_ROOT/tap" add Formula/thegn.rb
          if git -C "$PUBLISH_ROOT/tap" diff --cached --quiet; then
            printf 'outcome=unchanged\nnew=%s\n' "$old" >> "$GITHUB_OUTPUT"
          else
            git -C "$PUBLISH_ROOT/tap" \
              -c user.name='thegn release automation' \
              -c user.email='actions@users.noreply.github.com' \
              commit -m "thegn $TAG"
            new="$(git -C "$PUBLISH_ROOT/tap" rev-parse HEAD)"
            printf 'new=%s\n' "$new" >> "$GITHUB_OUTPUT"
            if ! GIT_SSH_COMMAND="$tap_ssh" git -C "$PUBLISH_ROOT/tap" \
              push --force-with-lease="refs/heads/$branch:$old" origin \
              "HEAD:refs/heads/$branch"; then
              if remote="$(GIT_SSH_COMMAND="$tap_ssh" git -C "$PUBLISH_ROOT/tap" \
                ls-remote origin "refs/heads/$branch" | awk '{print $1}')"; then
                printf 'observed=%s\n' "$remote" >> "$GITHUB_OUTPUT"
              else
                printf 'observed=unknown\n' >> "$GITHUB_OUTPUT"
              fi
              echo "::error::Homebrew push failed; publication was not confirmed."
              exit 1
            fi
            if ! remote="$(GIT_SSH_COMMAND="$tap_ssh" git -C "$PUBLISH_ROOT/tap" \
              ls-remote origin "refs/heads/$branch" | awk '{print $1}')"; then
              printf 'observed=unknown\n' >> "$GITHUB_OUTPUT"
              echo "::error::Could not verify the Homebrew remote branch after push."
              exit 1
            fi
            printf 'observed=%s\n' "$remote" >> "$GITHUB_OUTPUT"
            if [ "$remote" != "$new" ]; then
              echo "::error::Homebrew remote branch does not match the published candidate."
              exit 1
            fi
            printf 'outcome=committed\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize Homebrew publication
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          READY: ${{ steps.publication.outputs.ready }}
          TAG: ${{ inputs.tag }}
          OUTCOME: ${{ steps.publish.outputs.outcome }}
          OLD_TIP: ${{ steps.publish.outputs.old }}
          NEW_TIP: ${{ steps.publish.outputs.new }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          OBSERVED_TIP: ${{ steps.publish.outputs.observed }}
        run: |
          {
            echo "## Homebrew publication for $TAG"
            echo
            if [ "$OUTCOME" = committed ]; then
              old_tip="${OLD_TIP:- (new branch)}"
              old_tip="${old_tip# }"
              echo "Homebrew: committed $old_tip..$NEW_TIP on $BRANCH"
            elif [ "$OUTCOME" = unchanged ]; then
              echo "Homebrew: unchanged at ${OLD_TIP:- (unborn)}"
            elif [ "$READY" = true ]; then
              if [ -z "$BRANCH" ]; then
                echo "Homebrew: FAILED before the target was cloned; remote state unknown"
              elif [ "$OBSERVED_TIP" = unknown ]; then
                remote_state="unknown"
              elif [ "$OBSERVED_TIP" = "$OLD_TIP" ]; then
                remote_state="unchanged at ${OBSERVED_TIP:- (absent)}"
              else
                remote_state="moved to ${OBSERVED_TIP:- (absent)}"
              fi
              if [ -n "$BRANCH" ]; then
                echo "Homebrew: FAILED; target tip observed before push ${OLD_TIP:-unknown}; remote $remote_state"
              fi
            else
              echo "Homebrew publication remains pending; see the actionable warning above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary Homebrew deploy key
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${PUBLISH_ROOT:-}" ] && [[ "$PUBLISH_ROOT" == "$RUNNER_TEMP/"* ]]; then
            rm -rf "$PUBLISH_ROOT"
          fi
  publish-aur:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-external'
    needs: aur-srcinfo
    runs-on: ubuntu-latest
    environment: package-publication-aur
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Require a main-branch dispatch
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != refs/heads/main ]; then
            echo "::error::External publication must be dispatched from the main branch."
            exit 1
          fi
      - name: Validate release tag syntax
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::invalid release tag"
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check AUR publication enablement
        id: publication
        env:
          ENABLED: ${{ vars.PACKAGE_PUBLICATION_ENABLED }}
          AUR_DEPLOY_KEY: ${{ secrets.AUR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ "$ENABLED" = true ] || missing+=("PACKAGE_PUBLICATION_ENABLED=true")
          [ -n "$AUR_DEPLOY_KEY" ] || missing+=("AUR_DEPLOY_KEY")
          grep -q '^aur\.archlinux\.org ' "$GITHUB_WORKSPACE/.github/known_hosts" \
            || missing+=("an aur.archlinux.org host key in .github/known_hosts")
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=AUR publication pending::Nothing was pushed; missing: ${missing[*]}"
            checklist="Setup checklist: (1) create the AUR thegn-bin package repository;"
            checklist+=" (2) add its write-scoped deploy key to package-publication-aur"
            checklist+=" with a required reviewer; (3) add the verified AUR host key"
            checklist+=" to .github/known_hosts; (4) set PACKAGE_PUBLICATION_ENABLED=true."
            echo "::warning::$checklist"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.publication.outputs.ready == 'true'
        with:
          name: aur-metadata
          path: ${{ runner.temp }}/aur-metadata
      - name: Require exactly the generated AUR metadata files
        if: steps.publication.outputs.ready == 'true'
        run: |
          set -euo pipefail
          mapfile -t artifact_files < <(
            find "$RUNNER_TEMP/aur-metadata" -mindepth 1 -maxdepth 1 \
              -printf '%f\n' | LC_ALL=C sort
          )
          if [ "${#artifact_files[@]}" -ne 2 ] \
            || [ "${artifact_files[0]}" != .SRCINFO ] \
            || [ "${artifact_files[1]}" != PKGBUILD ] \
            || [ -L "$RUNNER_TEMP/aur-metadata/.SRCINFO" ] \
            || [ -L "$RUNNER_TEMP/aur-metadata/PKGBUILD" ] \
            || [ ! -f "$RUNNER_TEMP/aur-metadata/.SRCINFO" ] \
            || [ ! -f "$RUNNER_TEMP/aur-metadata/PKGBUILD" ]; then
            echo "::error::AUR metadata artifact must contain exactly PKGBUILD and .SRCINFO."
            exit 1
          fi
      - name: Download release PKGBUILD and compare with generated metadata
        if: steps.publication.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            echo "::error::Publish the draft release before external publication."
            exit 1
          fi
          publish_root="$(mktemp -d "$RUNNER_TEMP/publish.XXXXXX")"
          echo "PUBLISH_ROOT=$publish_root" >> "$GITHUB_ENV"
          mkdir -p "$publish_root/metadata" "$publish_root/keys"
          gh release download "$TAG" --dir "$publish_root/metadata" \
            --pattern "thegn-$TAG-PKGBUILD"
          manifest="$publish_root/metadata/thegn-$TAG-manifest.json"
          if ! gh release download "$TAG" --dir "$publish_root/metadata" \
            --pattern "thegn-$TAG-manifest.json" || [ ! -f "$manifest" ]; then
            echo "::error::release manifest missing: run the build to completion (verify-manifest) before publishing"
            exit 1
          fi
          if ! gh attestation verify "$manifest" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --deny-self-hosted-runners; then
            echo "::error::release manifest attestation did not verify"
            exit 1
          fi
          if [ "$(jq -r '.tag' "$manifest")" != "$TAG" ]; then
            echo "::error::release manifest tag does not match"
            exit 1
          fi
          pkgbuild="thegn-$TAG-PKGBUILD"
          manifest_sha="$(jq -r --arg n "$pkgbuild" \
            '[.assets[] | select(.name == $n) | .sha256] | if length == 1 then .[0] else "" end' \
            "$manifest")"
          if [[ ! "$manifest_sha" =~ ^[a-f0-9]{64}$ ]] \
            || [ "$(sha256sum "$publish_root/metadata/$pkgbuild" | cut -d ' ' -f 1)" != "$manifest_sha" ]; then
            echo "::error::$pkgbuild does not match the release manifest"
            exit 1
          fi
          artifact_sha="$(sha256sum "$RUNNER_TEMP/aur-metadata/PKGBUILD" | cut -d ' ' -f 1)"
          release_sha="$(sha256sum "$publish_root/metadata/thegn-$TAG-PKGBUILD" | cut -d ' ' -f 1)"
          if [ "$artifact_sha" != "$release_sha" ]; then
            echo "::error::The generated AUR metadata does not match the release PKGBUILD."
            exit 1
          fi
      - name: Materialize AUR deploy key
        if: steps.publication.outputs.ready == 'true'
        env:
          AUR_DEPLOY_KEY: ${{ secrets.AUR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "$AUR_DEPLOY_KEY" > "$PUBLISH_ROOT/keys/aur"
          chmod 600 "$PUBLISH_ROOT/keys/aur"
      - name: Publish generated AUR metadata
        id: publish
        if: steps.publication.outputs.ready == 'true'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          known_hosts="$GITHUB_WORKSPACE/.github/known_hosts"
          ssh_options="-o UserKnownHostsFile=\"$known_hosts\""
          ssh_options+=" -o GlobalKnownHostsFile=/dev/null"
          ssh_options+=" -o StrictHostKeyChecking=yes"
          ssh_options+=" -o HostKeyAlgorithms=ssh-ed25519"
          aur_ssh="ssh -i $PUBLISH_ROOT/keys/aur -o IdentitiesOnly=yes $ssh_options"
          GIT_SSH_COMMAND="$aur_ssh" git clone \
            ssh://aur@aur.archlinux.org/thegn-bin.git "$PUBLISH_ROOT/aur"
          branch=master
          git -C "$PUBLISH_ROOT/aur" checkout -q -B master
          old="$(git -C "$PUBLISH_ROOT/aur" rev-parse --verify -q HEAD || true)"
          {
            printf 'old=%s\n' "$old"
            printf 'branch=%s\n' "$branch"
            printf 'observed=unknown\n'
          } >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/aur-metadata/PKGBUILD" "$PUBLISH_ROOT/aur/PKGBUILD"
          cp "$RUNNER_TEMP/aur-metadata/.SRCINFO" "$PUBLISH_ROOT/aur/.SRCINFO"
          git -C "$PUBLISH_ROOT/aur" add PKGBUILD .SRCINFO
          if git -C "$PUBLISH_ROOT/aur" diff --cached --quiet; then
            printf 'outcome=unchanged\nnew=%s\n' "$old" >> "$GITHUB_OUTPUT"
          else
            git -C "$PUBLISH_ROOT/aur" \
              -c user.name='thegn release automation' \
              -c user.email='actions@users.noreply.github.com' \
              commit -m "thegn $TAG"
            new="$(git -C "$PUBLISH_ROOT/aur" rev-parse HEAD)"
            printf 'new=%s\n' "$new" >> "$GITHUB_OUTPUT"
            if ! GIT_SSH_COMMAND="$aur_ssh" git -C "$PUBLISH_ROOT/aur" \
              push --force-with-lease="refs/heads/$branch:$old" origin \
              "HEAD:refs/heads/$branch"; then
              if remote="$(GIT_SSH_COMMAND="$aur_ssh" git -C "$PUBLISH_ROOT/aur" \
                ls-remote origin "refs/heads/$branch" | awk '{print $1}')"; then
                printf 'observed=%s\n' "$remote" >> "$GITHUB_OUTPUT"
              else
                printf 'observed=unknown\n' >> "$GITHUB_OUTPUT"
              fi
              echo "::error::AUR push failed; publication was not confirmed."
              exit 1
            fi
            if ! remote="$(GIT_SSH_COMMAND="$aur_ssh" git -C "$PUBLISH_ROOT/aur" \
              ls-remote origin "refs/heads/$branch" | awk '{print $1}')"; then
              printf 'observed=unknown\n' >> "$GITHUB_OUTPUT"
              echo "::error::Could not verify the AUR remote branch after push."
              exit 1
            fi
            printf 'observed=%s\n' "$remote" >> "$GITHUB_OUTPUT"
            if [ "$remote" != "$new" ]; then
              echo "::error::AUR remote branch does not match the published candidate."
              exit 1
            fi
            printf 'outcome=committed\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize AUR publication
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          READY: ${{ steps.publication.outputs.ready }}
          TAG: ${{ inputs.tag }}
          OUTCOME: ${{ steps.publish.outputs.outcome }}
          OLD_TIP: ${{ steps.publish.outputs.old }}
          NEW_TIP: ${{ steps.publish.outputs.new }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          OBSERVED_TIP: ${{ steps.publish.outputs.observed }}
        run: |
          {
            echo "## AUR publication for $TAG"
            echo
            if [ "$OUTCOME" = committed ]; then
              old_tip="${OLD_TIP:- (new branch)}"
              old_tip="${old_tip# }"
              echo "AUR: committed $old_tip..$NEW_TIP on $BRANCH"
            elif [ "$OUTCOME" = unchanged ]; then
              echo "AUR: unchanged at ${OLD_TIP:- (unborn)}"
            elif [ "$READY" = true ]; then
              if [ -z "$BRANCH" ]; then
                echo "AUR: FAILED before the target was cloned; remote state unknown"
              elif [ "$OBSERVED_TIP" = unknown ]; then
                remote_state="unknown"
              elif [ "$OBSERVED_TIP" = "$OLD_TIP" ]; then
                remote_state="unchanged at ${OBSERVED_TIP:- (absent)}"
              else
                remote_state="moved to ${OBSERVED_TIP:- (absent)}"
              fi
              if [ -n "$BRANCH" ]; then
                echo "AUR: FAILED; target tip observed before push ${OLD_TIP:-unknown}; remote $remote_state"
              fi
            else
              echo "AUR publication remains pending; see the actionable warning above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary AUR deploy key
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${PUBLISH_ROOT:-}" ] && [[ "$PUBLISH_ROOT" == "$RUNNER_TEMP/"* ]]; then
            rm -rf "$PUBLISH_ROOT"
          fi
