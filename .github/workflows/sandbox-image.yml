name: sandbox-image
# Build + publish the multi-arch base sandbox image (hosts-as-resources):
# every run first admits one commit on main's lineage and builds only that commit.
# Credential-free per-arch builders upload OCI archives; the publisher checks
# out nothing, pushes each archive by digest under a generation-qualified tag,
# assembles and verifies the list from those digests, then attests the list and
# both children before printing its digest for DEFAULT_BASE_DIGEST.
# The publisher refuses a destination tag that moved during the run and reads it back after the push.
# (crates/thegn-core/src/image.rs).
# Per-run architecture tags remain in GHCR; retention cleanup is tracked under THE-502.
#
# Registry pull is the ALTERNATE delivery route (the default is registry-less
# transfer from the dev machine), so this publishes on demand / on tag — it is
# deliberately not part of `just ci`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag (e.g. v1)"
        required: true
        default: "v1"
  push:
    tags: ["sandbox-image-v*"]
permissions:
  contents: read
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/thegn-sandbox
concurrency:
  group: sandbox-image-publish
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Require main for manual dispatch
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch && "$DISPATCH_REF" != refs/heads/main ]]; then
            echo "::error::sandbox image dispatch must run from main"
            exit 1
          fi
      - name: Validate image tag
        id: tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          t="$REQUESTED_TAG"
          [ -n "$t" ] || t="${REF_NAME#sandbox-image-}"
          [[ "$t" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || {
            echo "::error::invalid image tag"
            exit 1
          }
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - name: Resolve and admit the source commit
        id: source
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then
            [[ "$REF_NAME" =~ ^sandbox-image-v[0-9A-Za-z._-]+$ ]] || {
              echo "::error::invalid sandbox image tag ref"
              exit 1
            }
            git fetch --no-tags origin main "refs/tags/$REF_NAME:refs/tags/$REF_NAME"
            sha="$(git rev-parse --verify "refs/tags/$REF_NAME^{commit}")"
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            sha="$DISPATCH_SHA"
            git cat-file -e "$sha^{commit}"
          else
            echo "::error::unsupported sandbox image event"
            exit 1
          fi
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::sandbox image source is not on main's lineage"
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  build:
    needs: admit
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            oci_arch: amd64
          - runner: ubuntu-24.04-arm
            oci_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.admit.outputs.sha }}
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: build the per-arch OCI archive
        run: |
          set -euo pipefail
          nix build .#sandbox-image
          mkdir -p "$RUNNER_TEMP/sandbox-image"
          ./result > "$RUNNER_TEMP/sandbox-image/image.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.oci_arch }}
          path: ${{ runner.temp }}/sandbox-image/image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  manifest:
    needs: [admit, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-amd64
          path: images/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-arm64
          path: images/arm64
      - name: record the destination tag before publishing
        id: prior
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$ACTOR" \
            --authfile "$HOME/.docker/config.json" --password-stdin
          tag_digest() {
            local raw err status=0
            raw="$(mktemp)"; err="$(mktemp)"
            skopeo inspect --raw --authfile "$HOME/.docker/config.json" \
              "docker://$IMAGE:$TAG" >"$raw" 2>"$err" || status=$?
            if [[ $status == 0 ]]; then
              echo "sha256:$(sha256sum "$raw" | cut -d ' ' -f1)"
            elif grep -qiE 'manifest unknown|name unknown' "$err"; then
              echo absent
            else
              cat "$err" >&2
              return 1
            fi
          }
          prior="$(tag_digest)" || {
            echo "::error::could not read $IMAGE:$TAG before publishing"
            exit 1
          }
          [[ "$prior" == absent || "$prior" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::registry returned an invalid destination tag digest"
            exit 1
          }
          echo "destination tag $IMAGE:$TAG was $prior before this run"
          echo "digest=$prior" >> "$GITHUB_OUTPUT"
      - name: push per-arch archives by digest
        id: arch
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$ACTOR" \
            --authfile "$HOME/.docker/config.json" --password-stdin
          for oci_arch in amd64 arm64; do
            archive="images/$oci_arch/image.tar"
            [[ -f "$archive" && ! -L "$archive" ]] || {
              echo "::error::downloaded OCI archive is missing or unsafe"
              exit 1
            }
            ref="$IMAGE:$TAG-$oci_arch-g$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            digest_file="arch-$oci_arch.digest"
            skopeo copy --dest-authfile "$HOME/.docker/config.json" \
              --digestfile "$digest_file" "docker-archive:$archive" "docker://$ref"
            digest="$(cat "$digest_file")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "::error::registry returned an invalid image digest"
              exit 1
            }
            echo "${oci_arch}_digest=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: assemble + push manifest list from frozen digests
        id: push
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          PRIOR_DIGEST: ${{ steps.prior.outputs.digest }}
          AMD64_DIGEST: ${{ steps.arch.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.arch.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          amd64_digest="$AMD64_DIGEST"
          arm64_digest="$ARM64_DIGEST"
          for digest in "$amd64_digest" "$arm64_digest"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "::error::artifact contains an invalid image digest"
              exit 1
            }
          done
          podman manifest create --authfile "$HOME/.docker/config.json" "$IMAGE:$TAG" \
            "docker://$IMAGE@$amd64_digest" \
            "docker://$IMAGE@$arm64_digest"
          tag_digest() {
            local raw err status=0
            raw="$(mktemp)"; err="$(mktemp)"
            skopeo inspect --raw --authfile "$HOME/.docker/config.json" \
              "docker://$IMAGE:$TAG" >"$raw" 2>"$err" || status=$?
            if [[ $status == 0 ]]; then
              echo "sha256:$(sha256sum "$raw" | cut -d ' ' -f1)"
            elif grep -qiE 'manifest unknown|name unknown' "$err"; then
              echo absent
            else
              cat "$err" >&2
              return 1
            fi
          }
          now="$(tag_digest)" || {
            echo "::error::could not re-read $IMAGE:$TAG before pushing"
            exit 1
          }
          if [[ "$now" != "$PRIOR_DIGEST" ]]; then
            echo "::error::destination tag $IMAGE:$TAG moved during this run" \
              "(expected $PRIOR_DIGEST, found $now); not published"
            exit 1
          fi
          list_digest_file=manifest-digest.txt
          podman manifest push --all --digestfile "$list_digest_file" \
            --authfile "$HOME/.docker/config.json" "$IMAGE:$TAG" "docker://$IMAGE:$TAG"
          list_digest="$(cat "$list_digest_file")"
          [[ "$list_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::registry returned an invalid manifest digest"
            exit 1
          }
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"
          echo "digest=$list_digest" >> "$GITHUB_OUTPUT"
      - name: verify pushed manifest by digest
        id: verify
        env:
          TAG: ${{ needs.admit.outputs.tag }}
          AMD64_DIGEST: ${{ steps.push.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.push.outputs.arm64_digest }}
          LIST_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Re-read the registry object by its immutable digest and verify its bytes.
          skopeo inspect --raw "docker://$IMAGE@$LIST_DIGEST" > manifest.json
          actual_digest="sha256:$(sha256sum manifest.json | cut -d ' ' -f1)"
          [[ "$actual_digest" == "$LIST_DIGEST" ]] || {
            echo "::error::pushed manifest bytes do not match the reported digest"
            exit 1
          }
          tag_digest() {
            local raw err status=0
            raw="$(mktemp)"; err="$(mktemp)"
            skopeo inspect --raw --authfile "$HOME/.docker/config.json" \
              "docker://$IMAGE:$TAG" >"$raw" 2>"$err" || status=$?
            if [[ $status == 0 ]]; then
              echo "sha256:$(sha256sum "$raw" | cut -d ' ' -f1)"
            elif grep -qiE 'manifest unknown|name unknown' "$err"; then
              echo absent
            else
              cat "$err" >&2
              return 1
            fi
          }
          published="$(tag_digest)" || {
            echo "::error::could not read $IMAGE:$TAG after pushing"
            exit 1
          }
          if [[ "$published" != "$LIST_DIGEST" ]]; then
            echo "::error::destination tag $IMAGE:$TAG was overwritten concurrently" \
              "(expected $LIST_DIGEST, found $published); not reporting success"
            exit 1
          fi
          python3 -c 'import json, os, sys
          with open("manifest.json", encoding="utf-8") as source:
              manifest = json.load(source)
          actual = [item.get("digest") for item in manifest.get("manifests", [])]
          expected = {
              "amd64": os.environ["AMD64_DIGEST"],
              "arm64": os.environ["ARM64_DIGEST"],
          }
          descriptors = manifest.get("manifests", [])
          if len(set(expected.values())) != 2:
              print("::error::frozen architecture digests must be distinct", file=sys.stderr)
              sys.exit(1)
          if len(actual) != 2 or {
              item.get("platform", {}).get("architecture") for item in descriptors
          } != set(expected):
              print("::error::pushed manifest platforms do not match amd64 and arm64", file=sys.stderr)
              sys.exit(1)
          if any(
              expected.get(item.get("platform", {}).get("architecture")) != item.get("digest")
              for item in descriptors
          ):
              print("::error::pushed manifest children do not match the frozen architecture digests", file=sys.stderr)
              sys.exit(1)'
      - name: Attest manifest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest amd64 image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.amd64_digest }}
          push-to-registry: true
      - name: Attest arm64 image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.arm64_digest }}
          push-to-registry: true
      - name: print the list digest (pin as DEFAULT_BASE_DIGEST)
        env:
          LIST_DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "DEFAULT_BASE_DIGEST = $LIST_DIGEST"
