name: sandbox-image
# Build + publish the multi-arch base sandbox image (hosts-as-resources):
# per-arch nix builds on native runners → push per-arch tags → assemble +
# push the manifest list → print its digest, which release commits pin as
# DEFAULT_BASE_DIGEST (crates/thegn-core/src/image.rs).
#
# Registry pull is the ALTERNATE delivery route (the default is registry-less
# transfer from the dev machine), so this publishes on demand / on tag — it is
# deliberately not part of `just ci`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag (e.g. v1)"
        required: true
        default: "v1"
  push:
    tags: ["sandbox-image-v*"]
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/thegn-sandbox
concurrency:
  group: sandbox-image-publish
  cancel-in-progress: false
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            oci_arch: amd64
          - runner: ubuntu-24.04-arm
            oci_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: resolve tag
        id: tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          t="$REQUESTED_TAG"
          [ -n "$t" ] || t="${REF_NAME#sandbox-image-}"
          [[ "$t" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || {
            echo "::error::invalid image tag"
            exit 1
          }
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - name: build + load
        run: |
          nix build .#sandbox-image
          ./result | podman load
      - name: push per-arch tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OCI_ARCH: ${{ matrix.oci_arch }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          ref="$IMAGE:$TAG-$OCI_ARCH"
          podman tag thegn-sandbox:latest "$ref"
          podman push "$ref"
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: resolve tag
        id: tag
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          t="$REQUESTED_TAG"
          [ -n "$t" ] || t="${REF_NAME#sandbox-image-}"
          [[ "$t" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]] || {
            echo "::error::invalid image tag"
            exit 1
          }
          echo "tag=$t" >> "$GITHUB_OUTPUT"
      - name: assemble + push the manifest list
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          podman manifest create "$IMAGE:$TAG" \
            "docker://$IMAGE:$TAG-amd64" \
            "docker://$IMAGE:$TAG-arm64"
          podman manifest push --all "$IMAGE:$TAG" "docker://$IMAGE:$TAG"
      - name: print the list digest (pin as DEFAULT_BASE_DIGEST)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          skopeo inspect --raw "docker://$IMAGE:$TAG" | sha256sum \
            | awk '{print "DEFAULT_BASE_DIGEST = sha256:" $1}'
