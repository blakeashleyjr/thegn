name: ci
# Server-side `just ci` gate. Adapted from the workflow proven green on the
# tg/quiet-falcon-1 branch (8 ubuntu jobs), extended with the stages `just ci`
# has since grown: deps-audit, check-cross, openspec-validate.
#
# Triggers: currently DISPATCH ONLY — see the disabled block above the `on:`
# key. When push/pull_request are restored, note the prior branch's finding: on
# a high-velocity main a PR's merge-ref sometimes can't be computed, which
# silently stops `pull_request` runs from scheduling — the `push` trigger covers
# main independently of merge-ability.
#
# Each `just ci` stage is its own job (parallel; one push surfaces every
# failure at once). Shared setup (nix + nix-store/cargo caches) is the local
# composite action .github/actions/ci-setup. Every gate runs through
# `nix develop --command` so the toolchain (rust + shellcheck/yamllint/taplo +
# cargo-deny/cargo-machete + openspec + cross targets) comes from the flake.
#
# `just ci` locally = lint (fmt + guards + ratchets) deps-audit build
# check-cross check-features check-msrv test doc-check openspec-validate
# coverage smoke sandbox-e2e-dns sandbox-e2e-db term-check nix-build — and
# `just ci-local` adds e2e. Stages NOT in the routine gate:
#  - sandbox-e2e-full (Tier-2 podman suites): not part of `just ci` either;
#    the Tier-1 dns/db tests (no container runtime needed) DO run here.
#  - macos: the aarch64-darwin build + unit tests. Opt-in per run (`extras:
#    true`) like windows/e2e — 10x runner cost. The openspec OOM that had it
#    hard-disabled is fixed (it runs on the lean `devShells.ci` now).
#  - windows: the msvc truth gate for the native Windows port (workspace check +
#    real-pipe/Job-Object kernel tests + release thegn.exe artifact; bare rustup,
#    no nix). Now opt-in per run: dispatch with `extras: true`.
#  - e2e: opt-in the same way (`extras: true`), and still red — stale baselines.
#
# nix `access-tokens` comes from the optional NIX_GITHUB_TOKEN secret. Every
# flake input is PUBLIC now (the private termite-chat input was dropped in
# ce1aa41d and `muse` is public), so the token only raises GitHub's anonymous
# API rate limit for flake fetches — it is not required to build. Fork PRs
# receive no secrets and the expression evaluates to an empty string, which nix
# accepts; if a fork's run trips the anonymous rate limit, that is the cause.
#
# NOTE: this repo has no submodules, and the checkout steps deliberately do not
# set `submodules: recursive`. It used to carry private `apps/*` submodules that
# an ephemeral GITHUB_TOKEN could not read, failing every job at checkout. They
# are gone and nothing in the workspace depends on them. Don't add either back.
# TEMPORARILY DISABLED — restore by un-commenting `push` and `pull_request`.
#
# CI is paused to stop spend, not because it was failing. Measured on the run
# for 4c3fe2bc: **~101 billable minutes per push to main**, and a PR costs the
# same again before its merge, so one change landed via PR was ~200 minutes.
# Roughly 55 of those 101 are fixed per-job overhead rather than work — 11 jobs
# x ~5 min of nix install plus realising the FULL dev shell (muse builds from
# source, openspec runs pnpm, yazi + preview tools, act, hyperfine). `fmt` is
# the clearest case: 5.4 minutes wall clock for about 5 seconds of real work.
#
# `workflow_dispatch` is deliberately kept, so the whole suite is still one
# click (or `gh workflow run ci.yml --ref <branch>`) when a change warrants it.
#
# Before turning it back on, do the cheap wins first or it will cost the same:
#   * `CI_RUNS_ON` (below) already selects self-hosted runners, and `ci-setup`
#     is already written to no-op there — pointing it at a Linux runner takes
#     Linux billing to ~0 with no code change. Biggest lever by far.
#   * give the cheap jobs a lean dev shell instead of the full one; that also
#     fixes the macOS job's openspec OOM.
#   * tier coverage / nix-build / check-cross to main + nightly rather than
#     every PR.
#
# WHAT STILL GUARDS THE CODE: the pre-push hook (`cargo test`, `clippy`,
# `smoke`). That is a real gate and must stay enabled while this is off. What is
# NOT covered until CI returns: coverage, cross-compilation, docs, deps-audit,
# nix-build, sandbox-e2e and openspec validation.
#
# push:
#   branches: [main]
# pull_request:
#   branches: [main]
on:
  workflow_dispatch:
    inputs:
      extras:
        description: "Also run the expensive opt-in jobs (windows, e2e). Costs extra."
        type: boolean
        default: false
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Runner selection. Every Linux job reads the repo variable `CI_RUNS_ON`; unset,
# it falls back to GitHub-hosted `ubuntu-latest`. Opt IN to the self-hosted
# ageless runners (see docs/self-hosted-ci.md) with one toggle, no edits:
#   gh variable set CI_RUNS_ON --body '["self-hosted", "ageless"]'
#   gh variable delete CI_RUNS_ON        # ← back to GitHub-hosted
# `ci-setup` adapts either way (installs nix + caches only on github-hosted).
# The `macos` job is always GitHub-hosted (macos-15).
#
# SECURITY — why GitHub-hosted is the fallback, not self-hosted. thegn is a
# PUBLIC repo and this workflow triggers on `pull_request`, so a fork PR's code
# runs in it. On a self-hosted runner that means an untrusted contributor's code
# executing on a personal machine against a PERSISTENT /nix/store, sccache and
# CARGO_HOME — which it can poison for every later run. GitHub's own guidance is
# not to use self-hosted runners with public repos. Before setting CI_RUNS_ON to
# the ageless labels, require approval for ALL outside contributors
# (Settings → Actions → "Require approval for all external contributors"), and
# treat approving a fork PR as running its code on your box.
jobs:
  fmt:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just fmt-check
  lint:
    # `just lint` also carries the git_cmd guard (no raw Command::new("git")).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just lint
  deps-audit:
    # cargo-deny (advisories/licenses/dup majors) + cargo-machete; fetches the
    # RustSec DB over the network on a cold cache.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      # deny.toml keeps the advisory clone at target/advisory-dbs (CARGO_HOME is
      # read-only in the dev sandboxes). That path is inside the restored rust
      # cache, which prunes it — cargo-deny then finds the directory present but
      # gutted, declines to refetch, and dies with "failed to load any advisories
      # in the database". Discard it so the fetch is always fresh; it costs one
      # shallow clone and it is the difference between auditing and pretending to.
      - run: rm -rf target/advisory-dbs
      - run: nix develop --command just deps-audit
  test:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    # `just build && just test` from a cold cache after a large refactor pushes
    # close to the old 40m cap; give it headroom.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      # The svc git tests create temp repos; their bare "remote" is made with
      # `git init --bare` (no -b), so a fresh runner's default `master` breaks
      # origin/main tracking. Give the runner the `main` default + an identity.
      - name: git defaults for the svc git tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.email ci@thegn.local
          git config --global user.name "thegn CI"
      - run: nix develop --command bash -lc "just build && just test"
  doc:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just doc-check
      # Doctests live with the docs gate, not the test gate: they are a whole
      # extra workspace compile and the repo currently has no runnable ones, so
      # `just test` (and therefore pre-push) no longer pays for them. Here they
      # still catch a runnable doctest that someone adds and breaks later.
      - run: nix develop --command just test-doc
  check-features:
    # Every named cargo feature compiles alone and all together (the
    # platform-portability spec's feature matrix).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just check-features
  check-msrv:
    # The declared `rust-version` builds, on the flake's pinned MSRV toolchain.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just check-msrv
  term-check:
    # The terminal-capability degradation matrix (`thegn doctor` under six
    # TERM/COLORTERM/NO_COLOR/override environments).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just term-check
  check-cross:
    # Typechecks the leaf crates' macOS/Windows code paths from Linux
    # (`cargo check --target`, no cross linker needed; targets come from the
    # flake's rust toolchain).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just check-cross
  openspec:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just openspec-validate
  coverage:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just coverage
  smoke:
    # Hermetic end-to-end CLI tests against the debug binary (isolated
    # XDG_STATE_HOME; includes the pty-smoke harness, which works on runners).
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just smoke
  sandbox-e2e:
    # Tier-1 only (DNS filter + DB audit trail) — no container runtime needed.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command bash -lc "just sandbox-e2e-dns && just sandbox-e2e-db"
  nix-build:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    # Routinely builds `.#thegn-nobridge` (the shipped stable binary). The full
    # `.#default` adds a second, cross-to-musl release compile of the whole
    # workspace for the provider bridge — dev-channel-only functionality — which
    # roughly doubles the job, so it runs on dispatch instead (and before a
    # release; see RELEASING.md).
    #
    # The 60m budget is for a cold build. Warm runs should now be far quicker:
    # the source is allowlisted (nix/source.nix), so docs/CI/test commits no
    # longer change the derivation hash and simply reuse the cached store path.
    timeout-minutes: 60
    env:
      # step `if:` can't reference `secrets` directly (GitHub rejects the whole
      # workflow run at validation time, before any job is scheduled, if it
      # does) — thread it through `env` instead, which secrets can populate.
      HAS_CACHIX: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
          # Its own lane, and a bigger one: this is the only job whose store
          # holds a built thegn, and it is the one worth not losing.
          cache-lane: nix-build
          gc-max-store-size: 8G
      # Populate the persistent binary cache (if one is configured) so remote
      # dev-envs — sprites especially — download the devShell closure over plain
      # HTTPS instead of rebuilding it from source over the flaky host-cache
      # reverse tunnel. cachix-action watches the store after setup, so every path
      # realized below is pushed. No-op until CACHIX_AUTH_TOKEN is set (+ optionally
      # the CACHIX_CACHE_NAME repo variable), so the gate is safe before standup.
      - name: Set up binary cache (optional)
        if: ${{ env.HAS_CACHIX == 'true' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'thegn' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Routine: the shipped binary only. Dispatch: the full install as a user
      # gets it, bridge included.
      - run: nix build .#thegn-nobridge --print-build-logs
        if: ${{ github.event_name != 'workflow_dispatch' }}
      - run: nix build .#default --print-build-logs
        if: ${{ github.event_name == 'workflow_dispatch' }}
      # Realize the closures a provider dev-env needs so cachix pushes them: the
      # static musl bridge and the FULL closure of each devShell (`inputDerivation`
      # depends on every build input, so pushing it caches the whole shell). Only
      # when a cache is configured — otherwise it's wasted work.
      - name: Seed cache with provider dev-env closures
        if: ${{ env.HAS_CACHIX == 'true' }}
        run: |
          nix build --print-build-logs \
            .#thegn-musl \
            .#devShells.x86_64-linux.sprite-full.inputDerivation \
            .#devShells.x86_64-linux.sandbox.inputDerivation \
            .#devShells.x86_64-linux.default.inputDerivation
  e2e:
    # TEMPORARILY OPT-IN — restore by deleting the `if:` below.
    #
    # The job was hitting its 30-minute timeout and being cancelled on most
    # runs (2 of the 3 before this change, on `main` itself), so it gated
    # nothing while costing half an hour of runner time per push. Two separate
    # problems are tangled up in that and both want fixing before it goes back
    # to blocking:
    #   1. the run does not finish inside 30 minutes;
    #   2. the committed baselines are stale — they were last recorded in
    #      0f9c5a9a, and 1726a8e1 changed the UI (a `help` chip, `delete` ->
    #      `close/delete`, `0 loc` -> `0 changed`) without re-recording. There
    #      are also no darwin baselines at all, so the suite cannot pass on a
    #      Mac even locally.
    # Re-record deliberately with `just e2e-update` and review that diff like
    # code; do not simply raise the timeout.
    #
    # Still runs on demand: dispatch the workflow, or put `[ci-e2e]` in a
    # commit message. `just e2e` locally is unchanged and remains the gate for
    # anything that alters a frame.
    # Opt-in even on a manual run: dispatch with `extras: true`. e2e is also
    # still red for the reasons above, so a bare dispatch must not spend 30
    # minutes rediscovering that.
    if: ${{ inputs.extras }}
    # Routine gate: the muse suite asserts on semantic `expect_*` checks, diffs
    # text/styled snapshots against committed baselines (byte-stable under the
    # THEGN_E2E determinism freeze), and ends with a `check_file` guard for
    # panics/overflows in the log. It spawns thegn in a PTY (works on ubuntu
    # runners) across resize/focus/input boundaries and end-to-end LSP/git flows.
    # On failure the per-case artifacts (final screen as text/png, snapshot
    # diffs, a trace) are uploaded — read those before reaching for a retry.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
      - run: nix develop --command just e2e
      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e-results/
          if-no-files-found: ignore
          retention-days: 14
  macos:
    # OPT-IN (10x minute cost): runs only when dispatched with `extras: true`,
    # the same gate as `windows` and `e2e`. macos-15 = GitHub-hosted Apple
    # silicon; covers the aarch64-darwin build + unit tests. What a headless job CANNOT prove — a
    # real terminal, panes, the `apple` container backend — is the on-device
    # checklist in CONTRIBUTING.md ("macOS notes" → "On-device checklist").
    # The OOM that got this job disabled is fixed: its first real run (4c3fe2bc)
    # died building `openspec` with exit 137 on the 7 GB runner — a tool this job
    # never invokes — and it now runs on `devShells.ci`, a lean shell carrying
    # only what `just build` and `just test` use (toolchain, just, nextest,
    # pkg-config, zlib). So there is no longer a reason it *cannot* run.
    #
    # It stays OFF by default anyway, on the same `extras` gate as `windows` and
    # `e2e`, because macOS runners bill at 10x and dispatch is currently the only
    # way CI runs at all — a bare dispatch (say, to check a Linux change) must
    # not quietly cost ten times more. Turn it on for a run with:
    #
    #     gh workflow run ci.yml --ref <branch> -f extras=true
    #
    # Make it unconditional only once darwin is a supported target rather than a
    # best-effort one, and once remote CI is un-paused.
    if: ${{ inputs.extras }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-setup
        with:
          nix-token: ${{ secrets.NIX_GITHUB_TOKEN }}
          gc-max-store-size: 8G
      - name: git defaults for the svc git tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.email ci@thegn.local
          git config --global user.name "thegn CI"
      - run: nix develop .#ci --command bash -lc "just build && just test"
  windows:
    # The msvc truth gate for the native Windows port. OPT-IN (like `macos`):
    # dispatch, or a `[ci-windows]` commit-message marker — which is what
    # CONTRIBUTING "Windows (native) notes" has always documented. It was
    # briefly routine, but the port has never produced a green run, so leaving
    # it routine just pins `main` red and hides real regressions in the Linux
    # gates. Flip it back to routine once it passes.
    #
    # The per-PR windows-gnu cross-*check* in `just check-cross` catches cfg
    # regressions cheaply; this job proves msvc + real-kernel semantics and
    # ships a usable binary artifact. windows-latest = GitHub-hosted x86_64
    # MSVC; no nix on Windows — bare rustup + cargo (the documented native dev
    # loop, see CONTRIBUTING "Windows (native)").
    # Opt-in even on a manual run: dispatch with `extras: true`. Without this
    # the job would fire on EVERY dispatch, which — now that dispatch is the
    # only way to run CI at all — quietly makes each manual run cost more.
    if: ${{ inputs.extras }}
    runs-on: windows-latest
    # 40 was not enough: with every test now passing, the job got as far as the
    # release build and was cancelled mid-link. A cold msvc release build of the
    # workspace is the long pole here, and the job is opt-in, so the budget can
    # afford to be generous.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
      # Named-pipe IPC round-trip + bind-lock semantics (cfg(windows) tests) —
      # the real-pipe truth gate for the daemon IPC seam. Scoped to the ipc
      # module until the full suite is validated on Windows.
      - run: cargo test -p thegn-svc --lib --locked ipc
      # Job Object semantics on a real kernel: terminate() reaps the tree and
      # dropping the last handle (KILL_ON_JOB_CLOSE) reaps it too.
      - run: "cargo test -p thegn-host --locked platform::"
      # Distribution: a release thegn.exe from every run — the download for
      # native Windows installs between tagged releases (release.yml ships the
      # windows-msvc archive on `v*` tags).
      - run: cargo build --release --locked -p thegn-host
      - uses: actions/upload-artifact@v7
        with:
          name: thegn-x86_64-pc-windows-msvc
          path: target/release/thegn.exe
          retention-days: 30
