# Dependabot version updates. Docs:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# apps/ and vendor/ are excluded from the cargo workspace (see Cargo.toml), so
# the root manifest at "/" is the single Cargo surface Dependabot needs to see.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Collapse the routine minor/patch churn into one PR; only majors get their
    # own review-worthy PR.
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
