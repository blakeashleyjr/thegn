name: Bug report
description: Something in thegn behaves incorrectly or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.
        For security-sensitive reports, do **not** file here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Environment (`thegn doctor`)
      description: Paste the output of `thegn doctor` (resolved capabilities, backends).
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: thegn version / commit
      description: Output of `thegn --version`, or the git commit you built.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows (native)
        - Other
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Outer terminal
      description: e.g. Ghostty, iTerm2, WezTerm, Windows Terminal, Alacritty, tmux, ...
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If relevant, run with `THEGN_LOG=info` and attach the tail of
        `$XDG_STATE_HOME/thegn/logs/thegn.log` (redact anything sensitive).
      render: text
    validations:
      required: false
