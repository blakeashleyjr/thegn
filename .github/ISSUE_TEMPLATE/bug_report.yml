name: Bug report
description: Something in thegn behaves incorrectly or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues and KNOWN_ISSUES.md first.
        For security-sensitive reports, do **not** file here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Diagnostics (`thegn doctor`)
      description: |
        Paste the output of `thegn doctor`. For crashes, hangs or anything hard to describe also run
        `thegn doctor bundle --out thegn-bundle.tar.gz`, open the archive and read its manifest,
        then attach it only if nothing sensitive is in it (redaction is best-effort). Do not paste
        tokens or private repository data.
      render: text
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: thegn version / commit
      description: Output of `thegn --version`, or the git commit you built.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (x86_64)
        - Linux (other)
        - macOS (Apple silicon)
        - macOS (Intel)
        - Windows (native)
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install thegn?
      options:
        - Release tarball (GNU)
        - Release tarball (musl)
        - Nix flake
        - Source build (./install.sh or cargo)
        - Other
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Outer terminal
      description: e.g. Ghostty, iTerm2, WezTerm, Windows Terminal, Alacritty, tmux, ...; include tmux/ssh if involved.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If relevant, run with `THEGN_LOG=info` and attach the tail of
        `$XDG_STATE_HOME/thegn/logs/thegn.log` (redact anything sensitive).
      render: text
    validations:
      required: false
