name: Feature request
description: Suggest an idea or improvement for thegn.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check the Roadmap in the README and existing
        issues first — it may already be planned or in progress.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that thegn makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? A keybind, a panel, a config key, a behavior?
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you weighed.
    validations:
      required: false
