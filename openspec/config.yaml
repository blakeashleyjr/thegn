# OpenSpec project configuration.
# `schema` selects the workflow (proposal -> specs -> design -> tasks).
# `context` is injected into every artifact instruction the AI generates, so it
# is the single place that teaches agents what thegn is and its hard rules.
# See CLAUDE.md for the full developer guide and tasks.md for the roadmap.
schema: spec-driven
context: |
  thegn (binary `thegn`, alias `tg`) is a terminal-native git-worktree IDE
  that is its own terminal multiplexer: one process, one session; each repo
  is a workspace, each git worktree a tab; the chrome is rendered in-process.
  The AI layer was removed before the public alpha — the shell never
  hard-depends on an agent; anything agent-adjacent is a plain configured
  command or a subprocess hook.

  ARCHITECTURE: docs/ARCHITECTURE.md is the single source (crates, event
  loop, rendering, platform code, provider seams, the capability catalog,
  config, keymap/help, state, sandboxing — each with its enforcing gate).
  How-to-add recipes: docs/extending/. Read them before designing.

  Hard invariants every change respects:
  - 0% idle: the loop blocks on poll_input(None); producers pulse the
    TerminalWaker; no blocking I/O on the loop or before the first frame.
  - Render decision is pure (render_plan::plan: Skip/Panes/Full); pane
    output never recomposes chrome.
  - Degrade at the edges: truecolor+Unicode composed, quantized once in
    wire.rs color_spec / caps::active_glyphs(); no literals at draw sites.
  - thegn-core is substrate-free (no tokio/termwiz/portable-pty/HTTP/forge
    SDK) and 95%-line covered; thegn-svc owns service seams; thegn-host is
    the compositor.
  - Every backend is a provider seam (thegn_core::seam): object-safe trait,
    caps ⇔ optional ops, config `kind` implemented-or-`reserved`, Probe in
    `thegn doctor`; vendor CLIs only inside implementation files.
  - External doors (control HTTP/gRPC, CLI verbs, MCP, plugin host calls)
    project thegn_core::capability::CATALOG; gaps are listed, shrink-only.
  - git is the source of truth for worktrees, the forge for PRs; SQLite is a
    cache + resurrection layer.

  Invariants are enforced by shrink-only ratchets (test/*-ratchet.txt) and
  tests, never by convention: a proposal that adds an action, config key,
  help page, provider, capability or plugin verb must name the gate it
  satisfies (docs/extending/ lists them). Changes are spec-driven: specs in
  openspec/specs/ describe current behaviour; deltas live in the change.
rules:
  proposal:
    - Link the corresponding tasks.md roadmap item(s) by group letter + number in the Impact section.
    - Do not propose changes that make the AI-free shell hard-depend on AI layers.
  design:
    - Call out which render damage channel (Skip/Panes/Full) and event-loop wake path the change touches, if any.
    - Note any SQLite schema change and the required user_version bump.
    - New interactive surfaces must state which help context key (`zone:*` / `panel:*`) maps to their docs/help/ page.
  tasks:
    - Core logic tasks must include unit tests (95% line gate on thegn-core).
    - Tasks adding or renaming an action, keybind, zone, panel section, or config table must update docs/help/.
    - The help ratchet test enforces action-to-page coverage; test/help-ratchet.txt may only shrink.
    - End with a task to run `just ci` (includes openspec-validate).
