# cargo-deny configuration (`just deps-audit`, part of `just lint`).
# Gates: security advisories, license policy, duplicate major versions.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Fail on any advisory (vulnerabilities, unmaintained, unsound, notices are
# warnings by default; vulnerabilities error).
# Workspace-local DB path: $CARGO_HOME is read-only in the dev sandboxes
# (bwrap RO-$HOME), which blocked the advisory-db fetch/lock; target/ is
# always writable and CI runners simply keep the clone in their target cache.
db-path = "target/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Documented exceptions — each needs a reason and an exit condition.
ignore = [
  # cargo-deny advisory ignores are keyed by advisory ID; the reason below
  # pins the reviewed match to rsa 0.9.10. Owner: thegn maintainers. Review
  # trigger: the first patched rsa release or THE-670 replacing octocrab;
  # either event retires this exception. See
  # https://rustsec.org/advisories/RUSTSEC-2023-0071.html. The accepted risk
  # is that this exact linked operation is not invoked: native.rs uses only a
  # personal bearer token, with no AppAuth/private-key call site.
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 only; owner: thegn maintainers; review trigger: patched rsa release or THE-670; no AppAuth/private-key call path; https://rustsec.org/advisories/RUSTSEC-2023-0071.html" },
  # tokei 15.0.0 (code-stats) dropped the clap 2 / parking_lot 0.11 legacy
  # tree that used to bring ansi_term, atty, instant, vec_map and num_cpus
  # here; those four ignores are retired (2026-09-15). term_size is still a
  # direct tokei dependency, and is an unmaintained notice, not a
  # vulnerability. Drop when tokei moves off it or the stats backend is
  # replaced.
  "RUSTSEC-2020-0163", # term_size unmaintained (via tokei)
  # syntect 5 (syntax highlighting) still serializes its dumps with
  # bincode 1; unmaintained-notice only. Drop when syntect moves off it.
  "RUSTSEC-2025-0141",
  # paste 1.0.15 is unmaintained (author archived it); reached only through
  # iroh's netlink stack (netlink-packet-core, the call-home reach). A
  # proc-macro with no runtime surface and no safe upgrade. Drop when the
  # netlink crates move off paste.
  "RUSTSEC-2024-0436", # paste unmaintained (via iroh → netlink-packet-core)
]

[licenses]
# Permissive set only; anything else needs an explicit exception here.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  # data-tables licenses used by unicode crates (finl_unicode, wezterm-bidi)
  "Unicode-DFS-2016",
  # terminfo (transitive via termwiz path)
  "WTFPL",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Duplicate versions are a warning, not an error: the tree already carries a
# few known splits (syn 1+2, clap 2+4, windows 0.57/0.58/0.62). Ratchet to
# "deny" once those are consolidated.
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal `{ path = ... }` deps are versionless by design; none of
# these crates are published.
allow-wildcard-paths = true

# --- crate dependency boundaries -------------------------------------------
# The workspace-level rule ("thegn-core never depends on tokio/termwiz/…; only
# the owning crates do") lives in crates/thegn-core/tests/crate_boundaries.rs,
# which reads every crate's Cargo.toml. cargo-deny's `wrappers` can't express
# it: it requires *every* direct parent of a banned crate — including the
# dozens of third-party crates that depend on tokio — to be listed.
# Historical: the emulator is `alacritty_terminal`, and a native ssh backend
# never landed (the ssh path is the `ssh` CLI). These tripwires keep stale docs
# from becoming stale code.
[[bans.deny]]
name = "vt100"
[[bans.deny]]
name = "russh"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
