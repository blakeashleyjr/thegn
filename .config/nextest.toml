# cargo-nextest configuration. Read automatically by `cargo nextest run`
# (both the CI `test` job and the pre-push hook run `just test`).

# Bound a hung test. Without `terminate-after`, nextest warns forever and a
# wedged test only surfaces at the CI job's `timeout-minutes: 50` — as a
# timed-out job rather than a named failing test. A lock-starved test
# (activity::tests::concurrent_ack_and_poll_never_lose_ack_or_tear) sat here for
# minutes before this was added. 60s x 5 = 5 minutes is far above any healthy
# test in this suite (the whole 4200-test run finishes well inside that).
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# Global concurrency cap.
#
# nextest defaults to one test process per core. On a 24-core box developing
# across several worktrees at once that is 24 concurrent test binaries PER
# worktree, on top of each worktree's cargo build jobs — enough to pin the
# machine and starve the desktop. 8 keeps a few worktrees testing together
# within the aggregate ceiling. The `git-subprocess` group below nests inside
# this pool, so its cap still applies.
test-threads = 8

# Concurrency cap for git-subprocess-heavy tests.
#
# The worktree / wizard-worker / git-backend / mcp-git tests each shell out to
# real `git` (init, commit, worktree add, rebase, stash) — fsync-heavy ops. Run
# at the full default parallelism (one test per core) the suite self-saturates:
# dozens of these tests fire hundreds of concurrent `git` processes doing fsync
# on the same filesystem, and it gets pathological when the box is already busy
# (a live `thegn` tracing git on the same repo, or a second `cargo test`). Under
# that IO storm individual git ops lose lock/IO races and the tests blow past
# their internal deadlines and fail — even though every one of them passes in
# isolation and at normal load.
#
# Cap how many run *at once* so the storm can't form. The rest of the suite
# still runs fully parallel; only membership in this group is throttled, so the
# git tests cost a few extra seconds of wall-clock instead of flaking.
[test-groups]
git-subprocess = { max-threads = 6 }
# Windows needs a much tighter cap than the IO-storm one below -- and it covers
# more than git: anything that spawns a Git-for-Windows MSYS binary.
#
# `git rebase -i` runs its sequence editor through Git-for-Windows' bundled
# MSYS `sh.exe`, and MSYS `fork()` is emulated (no real COW fork). Under
# parallel test load many simultaneous `sh.exe` starts lose the address-space
# race and die with:
#   sh.exe: *** fatal error - add_item ("\??\C:\Program Files\Git", "/", ...)
# The same fault hits any test that shells out to that userland — the bridge
# proc / `output_bounded` fixtures spawn `sh.exe` directly and lose their stdout
# to it, and the host headroom probe runs a whole `sh` + `awk` pipeline — so
# they share this cap rather than each getting one of their own.
#
# Every one of these tests passes single-threaded; the failure is contention,
# not logic. Two at a time is enough to keep the fork emulation happy.
git-subprocess-windows = { max-threads = 2 }

# Windows ConPTY concurrency cap.
#
# Every real-pane test opens a pseudoconsole, and each one costs Windows a
# `conhost.exe` process of its own plus a PowerShell child -- far heavier than
# a unix pty, which is why the cap is Windows-only. At full default parallelism
# these self-saturate and children take seconds to reach their first write,
# which is long enough for the drain deadlines to lapse. Four at a time keeps
# the whole group under five seconds with no contention.
conpty-windows = { max-threads = 4 }

# NB: the first matching override wins, so the Windows arm must come first.
[[profile.default.overrides]]
platform = 'cfg(windows)'
#
# `daemon::session::tests::` and `plugin::` belong here too, and their absence
# is why they flaked. They run their scripts under `util::posix_shell()` — Git
# for Windows' MSYS `sh.exe` — so they are MSYS spawns exactly like the rest of
# this group. `daemon::session` was only ever claimed by the ConPTY group below
# (cap 4), and since the first matching override wins it got the looser cap,
# spawning MSYS shells four at a time over the two this group enforces.
# Measured: 7/10 passing at four-way parallelism versus 10/10 serially. Cap 2 is
# stricter than the ConPTY cap on both axes, so listing it here satisfies both.
#
# `plugin::` at module breadth, for the same reason the `git::` entry below is
# written broad rather than as `git::tests::`: the shell-spawning tests are
# spread across submodules (`proc`, `session`, `provider`, `loader`), and naming
# them one at a time is how this gap happened twice — `plugin::provider`'s
# scripted-plugin round-trip failed a full run after `proc` and `session` had
# already been added. The breadth covers 26 tests against 17 for the two narrow
# filters.
# `binary(plugin_example)` for the same reason, spelled as a binary because it
# is a separate integration target: the name filters above can never claim it,
# exactly as `binary(pty_launch)` is spelled in the ConPTY group below. It runs
# the bundled `hello.sh` example through MSYS `sh` under a 10s spawn deadline,
# and was measured overrunning it at 11s under load while passing in ~1s on a
# quiet box — a deadline lapse, not a broken example.
filter = 'test(/worktree::tests::/) | test(/wizard::tests::worker_/) | test(/git::/) | test(/mcp_git::tests::/) | test(e2e_cargo_real_repo) | test(/bridge::tests::/) | test(/plugin::/) | test(/bundle::tests::/) | test(/host::tests::/) | test(/sandbox_prefetch::tests::/) | test(/daemon::session::tests::/) | binary(plugin_example)'
test-group = 'git-subprocess-windows'
# Retry, because the hazard is EXTERNAL and measured — not a flaky assertion.
#
# `sh -c 'sleep 0.2; exit 0'` was spawned 120 times straight from a native
# process, **no PTY and no thegn involved at all**: two of them never exited.
# ~1.7% per spawn, on the shell itself. The daemon set alone spawns about ten
# per run, which is why roughly one full-workspace run in two used to carry a
# failure while every one of these tests passes in isolation.
#
# Nothing on thegn's side can fix that, and the caps above only reduce it. Two
# retries take a 1.7%-per-spawn hazard to ~0.005%. Scoped to this Windows group
# only — the rest of the suite has no retries and must stay that way, since a
# retry on a genuine flake is a bug in hiding. If a test here starts failing
# *every* attempt, that is a real failure and will still be reported as one.
retries = 2

[[profile.default.overrides]]
# Whole modules (not individual tests) so tests added to them inherit the cap.
# `git::` (not `git::tests::`) so the per-operation submodules — git::rebase,
# git::stash, git::patch, git::bisect, … — are covered too; they shell out just
# as hard. Verified: ten `mod tests` live under `crates/thegn-svc/src/git/`, so
# narrowing to `git::tests::` would leave nine of them ungrouped.
#
# `mcp_git::tests::` and `pty_over_iroh` were removed on main because they match
# nothing (`cargo nextest list -E …` returns empty), and a filter matching
# nothing is silent — it reads as coverage it is not providing. Both are gone
# here too; only the `git::` breadth is kept.
filter = 'test(/worktree::tests::/) | test(/wizard::tests::worker_/) | test(/git::/) | test(e2e_cargo_real_repo)'
test-group = 'git-subprocess'

[[profile.default.overrides]]
# Real-pane (ConPTY) tests -- whole modules, so newly added ones inherit the cap.
platform = 'cfg(windows)'
filter = 'test(/pane::tests::/) | test(/panes::tests::/) | test(/daemon::session::tests::/) | test(/daemon::service::tests::/) | test(/handlers::provision::tests::/) | binary(pty_launch)'
test-group = 'conpty-windows'
