# cargo-nextest configuration. Read automatically by `cargo nextest run`
# (both the CI `test` job and the pre-push hook run `just test`).

# THE-744: keep every nextest test process away from the user's XDG state.
# Module-level guards cover known writers; this run-wide setup also isolates
# tests that use production defaults without an explicit per-test environment
# guard. Nextest has no teardown script, so setup removes isolated state dirs
# older than a day before creating a fresh one. The sweep is best-effort because
# another process may delete /tmp entries mid-scan (THE-789); only creating the
# fresh directory can fail setup.
experimental = ["setup-scripts"]

[scripts.setup.isolate-state]
command = [
  "sh",
  "-c",
  "{ find \"${TMPDIR:-/tmp}\" -maxdepth 1 -name 'thegn-nextest-state.*' -mmin +1440 -exec rm -rf {} + 2>/dev/null || true; }; d=$(mktemp -d \"${TMPDIR:-/tmp}/thegn-nextest-state.XXXXXX\") && printf 'XDG_STATE_HOME=%s\\n' \"$d\" >> \"$NEXTEST_ENV\"",
]

[[profile.default.scripts]]
filter = 'all()'
setup = ['isolate-state']

# Bound a hung test. Without `terminate-after`, nextest warns forever and a
# wedged test only surfaces at the CI job's `timeout-minutes: 50` — as a
# timed-out job rather than a named failing test. A lock-starved test
# (activity::tests::concurrent_ack_and_poll_never_lose_ack_or_tear) sat here for
# minutes before this was added. 60s x 5 = 5 minutes is far above any healthy
# test in this suite (the whole 4200-test run finishes well inside that).
[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }

# Global concurrency cap.
#
# nextest defaults to one test process per core. On a 24-core box developing
# across several worktrees at once that is 24 concurrent test binaries PER
# worktree, on top of each worktree's cargo build jobs — enough to pin the
# machine and starve the desktop. 8 keeps a few worktrees testing together
# within the aggregate ceiling. The `git-subprocess` group below nests inside
# this pool, so its cap still applies.
test-threads = 8

# Concurrency cap for git-subprocess-heavy tests.
#
# The worktree / wizard-worker / git-backend / mcp-git tests each shell out to
# real `git` (init, commit, worktree add, rebase, stash) — fsync-heavy ops. Run
# at the full default parallelism (one test per core) the suite self-saturates:
# dozens of these tests fire hundreds of concurrent `git` processes doing fsync
# on the same filesystem, and it gets pathological when the box is already busy
# (a live `thegn` tracing git on the same repo, or a second `cargo test`). Under
# that IO storm individual git ops lose lock/IO races and the tests blow past
# their internal deadlines and fail — even though every one of them passes in
# isolation and at normal load.
#
# Cap how many run *at once* so the storm can't form. The rest of the suite
# still runs fully parallel; only membership in this group is throttled, so the
# git tests cost a few extra seconds of wall-clock instead of flaking.
[test-groups]
git-subprocess = { max-threads = 6 }

[[profile.default.overrides]]
# Whole modules (not individual tests) so tests added to them inherit the cap.
#
# A filter that matches nothing is silent — nextest neither warns nor errors —
# so a stale one reads as coverage it isn't providing. `mcp_git::tests::` and
# `pty_over_iroh` were both here and both matched zero tests (`cargo nextest
# list -E …` returns empty); they were removed rather than left as decoration.
# Re-add a module here when it starts shelling out to real `git`.
filter = 'test(/worktree::tests::/) | test(/wizard::tests::worker_/) | test(/git::tests::/) | test(e2e_cargo_real_repo)'
test-group = 'git-subprocess'

# `just test-windows-wine`: the workspace tests cross-compiled for
# x86_64-pc-windows-gnu and run under Wine (test/wine-runner.sh). Inherits
# everything above from `default` (state isolation, timeouts, groups).
#
# `default-filter` is the Wine skip list. Every entry is a test that is
# correct on real Windows (or not yet known to be wrong there) but cannot pass
# under Wine, with the Wine limitation that causes it. A test that fails
# because thegn is WRONG on Windows, or because the test itself assumes Linux,
# does NOT belong here — that is a product bug, tracked as an issue, and
# hiding it would make this gate lie. A filter that stops matching is silent
# (see the git-subprocess note above), so prune entries when their test moves.
#
# Current entries, all one cause: Wine maps the host's Unix root as drive Z:
# and resolves `/bin/sh`, `/proc/self/fd` etc. through it, so a test guard of
# the form `Path::new("/bin/sh").exists()` is TRUE under Wine (it is false on
# real Windows, where these tests return early and pass). The test then spawns
# `sh`, which a Windows CreateProcess cannot run. The guards would be better as
# `cfg!(unix)`; until then they are skipped here, not on real Windows.
[profile.wine]
default-filter = '''
all()
- (package(thegn-media) & test(/^helper::tests::(completes_and_captures|grandchild_dies_with_the_tree|infinite_stderr_is_capped|infinite_stdout_is_capped|never_exit_times_out_and_is_reaped|cancelling_the_future_kills_the_tree)$/))
- (package(thegn-metrics) & test(=sample::tests::reaped_tracked_process_is_pruned_and_its_proc_fd_is_released))
'''
