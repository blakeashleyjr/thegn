[package]
name = "thegn-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "thegn substrate-agnostic core: state, git, sandbox, config, theme"

[features]
test-utils = []

# `cfg(kani)` (the `#[cfg(kani)]` proof module in `termcaps.rs`, run via
# `just verify-kani`) is declared as a known cfg in the workspace lints.
[lints]
workspace = true

[dependencies]
# The media model lives in the C-dep-free `thegn-media` leaf (so its per-OS
# control backends cross-check); core re-exports it via `media.rs` and lowers
# `MediaConfig` into the leaf's `ResolveOpts`. Pure-Rust dep — does not affect
# core's own (non-cross-compilable) status.
thegn-media.workspace = true
# Only for the `clap::ValueEnum` derive on `github::MergeMethod` (a CLI arg type
# that lives with its domain model). Cheap; keeps core CLI-usable.
clap.workspace = true
anyhow.workspace = true
schemars = "0.8"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
# Comment/format-preserving config authoring (config_write.rs): the write half of
# `thegn env create` / `config set`, so the setup UI edits config.toml in place
# without clobbering the user's comments. Pure-Rust (cross-compile-safe).
toml_edit = "0.25.12"
walkdir.workspace = true
# Parallel directory walker behind `disk::measure_worktree` (the `du` replacement).
# Used purely as a walker — every ignore rule is switched OFF there, because the
# whole point of that scan is to report the size of `target/`. Same crate ripgrep
# and fd walk with, and already a dependency of thegn-host/thegn-svc.
ignore.workspace = true
# Token-reduction engine: ANSI stripping + custom-filter regexes (proxy::compress).
regex.workspace = true
syntect.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# fff's pure-Rust SIMD fuzzy matcher (no C deps, cross-compilable) — replaces
# nucleo-matcher for scrollback/list fuzzy search in the substrate crate.
neo_frizbee.workspace = true
# Word-level / intra-line diff for the diff view (item 601): pure-Rust,
# `TextDiff::from_words` tokenizes on word boundaries.
similar = "3"
fluent-templates = "0.15.1"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
once_cell = "1.21.4"
# Push command-inbox envelope authentication (push_inbox.rs): HMAC-SHA256 over
# the canonical envelope. Pure-Rust, no C deps, cross-compilable — keeps core's
# substrate-free status (a hasher is not a runtime).
hmac = "0.12"
sha2 = "0.10"
# Display-cell widths for the usage view's padded name column (`usage_view.rs`):
# chars ≠ cells on wide glyphs, and `format!("{:<n$}")` drifts. Same crate the
# host sizes text with; was already here as a dev-dep for the glyph tables.
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# macOS activity scanner (src/activity.rs): libproc — `proc_listallpids` +
# `proc_pidinfo` for cwd and CPU time, plus `mach_timebase_info` to convert mach
# absolute units. The direct syscall seam is ~1 call per process instead of
# sysinfo's ~5 plus an ARG_MAX-sized allocation, on a path that runs at up to 1Hz.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# Off Linux: the Windows activity scanner (src/activity.rs — per-process cwd +
# CPU via the PEB read) and `util::platform_hostname` on every non-Linux target.
# macOS takes the libproc path above for the scanner but still needs this for
# the hostname, so the gate stays "not linux" rather than narrowing further.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { workspace = true }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

# Theme/palette construction — runs at startup and on every theme cycle.
[[bench]]
name = "core_hot"
harness = false
