[package]
name = "thegn-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
repository.workspace = true
description = "thegn native terminal host: the compositor + in-process chrome"

# The binary is `thegn` in-tree; the Nix package + install.sh add a short
# `tg` alias.

[lints]
workspace = true
[[bin]]
name = "thegn"
path = "src/main.rs"

# Staged for when the workspace crates become publishable (see RELEASING.md):
# `cargo binstall thegn` will then resolve the release assets the `release`
# workflow uploads, whose names match this pkg-url. Inert while `publish = false`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/thegn-v{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "thegn{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
# In-process sampling profiler (SIGUSR2 → flamegraph dump from the live process,
# sidestepping ptrace_scope=1). Zero cost when off: the `pprof` dep and the
# signal handler are only compiled in under this feature. Build with
# `cargo build --features profiling` (see `just profile`).
profiling = ["dep:pprof"]
# The dev release channel. Empty by design — it does not pull in extra code,
# it only flips the compiled-in *default* channel to `dev` so experimental
# subsystems (remotes, AI/proxy, observe, placement, non-GitHub trackers) are
# honoured instead of clamped off. `THEGN_CHANNEL` overrides it either way.
# The regular build omits this (default = stable); Nix builds `.#dev` with it.
# See `src/channel_state.rs` and `thegn_core::channel`.
dev = []

[dependencies]
clap = { workspace = true, features = ["derive"] }
clap_complete.workspace = true
thegn-core.workspace = true
thegn-svc = { workspace = true, features = ["control-grpc"] }
thegn-metrics.workspace = true
thegn-media.workspace = true
anyhow.workspace = true
tracing.workspace = true
# CSPRNG for the iroh home secret key + per-sandbox auth tokens (src/iroh_home.rs).
getrandom = "0.4"
iroh.workspace = true
serde.workspace = true
serde_json.workspace = true
# `config show` round-trips the effective config as TOML; `config schema` emits
# the JSON schema (schemars pinned to core's version).
toml.workspace = true
schemars = "0.8"
# OS keyring for provider tokens (src/secret.rs). Pure-Rust backends only: on
# Linux the `async-secret-service` path uses zbus (NOT `sync-secret-service`,
# which pulls the C `libdbus-sys`); `async-io` is its lightweight runtime. Native
# on macOS/Windows. A missing Secret Service falls back to a 0600 file / env var.
keyring = { version = "3", default-features = false, features = [
  "async-secret-service",
  "async-io",
  "crypto-rust",
  "apple-native",
  "windows-native",
] }
# Compositor substrate (Phase 1). Feature set is pinned at the workspace level.
tokio = { workspace = true }
# Embedded host nix binary cache (src/nixcache.rs): an axum HTTP server that serves
# the host /nix/store to sprites over the reverse tunnel. tokio-util streams the
# `nix-store --dump` NAR with constant memory; futures provides the Stream trait.
axum = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
futures = { workspace = true }
portable-pty.workspace = true
# Image decoding for the document-viewer graphics path (src/rasterize.rs decodes
# image/PDF-page/Mermaid rasters to RGBA for the kitty preview in src/graphics.rs).
# PNG + JPEG only — bound the codec/compile bloat.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
] }
termwiz.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
ignore.workspace = true
# fff file-search engine (src/fff_backend.rs) + its pure-Rust SIMD matcher for
# in-memory list fuzzing (palette/gitui/workspace picker).
fff-search.workspace = true
neo_frizbee.workspace = true
notify = "8"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls",
] }
# Optional in-process sampling profiler (the `profiling` feature). flamegraph
# The app-tab embedding contract (AppTile, shared theme, the pinned ratatui
# re-export). The host renders embedded apps' ratatui buffers through
# `tg_kit::ratatui` so the Buffer type is identical to what the apps produce.
tg-kit = { path = "../tg-kit" }
# The embedded "Observe" observability app tile (gtui). Rendered through the
# same `tg_kit::ratatui` Buffer as any other AppTile.
gtui-embed = { path = "../gtui-embed" }
tokei.workspace = true
# Symbol-declaration regex (search_everywhere symbol sweep) — extracts the
# identifier from a definition line returned by fff grep.
regex.workspace = true
alacritty_terminal = "0.26"
toml_edit = "0.25.12"
# Display-width math: chrome layout (CJK/wide/emoji-aware truncation, so a line
# that measures `w` paints exactly `w` columns) and the compositor border clamp
# (never advance a wide cell past a pane's content rect into the card border).
unicode-width = "0.2"
sha2 = "0.10"
base64 = "0.22"
# Serve mode mounts the control-plane gRPC service into the TCP axum router.
tonic.workspace = true

# --- platform seams (src/platform/) ---
# All OS-conditional syscall wrappers live in src/platform/{unix,windows}.rs;
# these deps are gated so the other platform's graph never compiles them.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix.workspace = true
# The sampling profiler, UNIX-ONLY by construction: pprof samples via SIGPROF
# and pulls in `nix`, `pthread_t` and `siginfo_t`, none of which exist on
# Windows. Left ungated, `--features profiling` did not degrade there --- it
# failed to COMPILE, with a wall of errors from a dependency the user never
# named. Gated here, the feature is simply inert on Windows.
# The feature emits an SVG directly; protobuf would add pprof output.
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
[dev-dependencies]
# The architecture ratchets (`test/*-ratchet.txt`) share one helper.
thegn-core = { workspace = true, features = ["test-utils"] }
# Real on-disk fixtures for tests whose subject IS the filesystem — notably the
# symlinked-worktree watcher case, which literal paths cannot express.
tempfile.workspace = true
