[package]
name = "thegn-metrics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
description = "Cross-platform system metrics substrate for the thegn masthead + telemetry overlay"

# Deliberately a LEAF crate with no SQLite/C build deps, so it can be
# `cargo check --target <macos|windows>`-ed on a Linux CI box (see the
# `check-cross` justfile recipe). Keep heavy deps out.

[lints]
workspace = true
[dependencies]
sysinfo.workspace = true

# statvfs for the unix disk-free fast path.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Battery on non-Linux (Linux uses our own sysfs reader in battery.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
starship-battery.workspace = true

# Temperature sensors on Apple silicon (thermal.rs): `sysinfo::Components` is
# empty there and `ioreg` publishes no value, so the readings come from
# `IOHIDEventSystemClient`, which needs CoreFoundation types. Both crates are
# already in the workspace graph (keyring → security-framework), so this adds a
# manifest line, not a build. `libc` is for `dlopen`/`dlsym` — the private IOKit
# symbols are resolved at runtime so their removal degrades to "no thermals"
# instead of a binary that will not launch.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
