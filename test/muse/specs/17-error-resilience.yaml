name: error_resilience
# Stress: resize storm, panel/sidebar toggles, mode flips and splits in quick
# succession — then prove the UI is still coherent (mode, prompt, panes) and
# the log is clean.
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30"]
spawn:
  - sh
  - -c
  - |
    # A fixture repo with pinned dates so its hashes, ages and branch names are
    # the same on every machine (the panel renders them). thegn runs in it.
    set -e
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 1500
  max_settle_ms: 6000
steps:
  # Startup: the statusbar mode and the pane's (fixed, `$ `) prompt.
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - resize: "80x24"
  - resize: "200x50"
  - resize: "40x12"
  - resize: "160x40"
  - resize: "100x30"
  - resize: "120x36"
  - key: {key: "p", mods: [ctrl, alt]}
  - key: {key: "p", mods: [ctrl, alt]}
  - key: {key: "s", mods: [ctrl, alt]}
  - key: {key: "s", mods: [ctrl, alt]}
  - key: {key: "p", mods: [ctrl, alt]}
  - key: {key: "p", mods: [ctrl, alt]}
  - key: {key: "s", mods: [ctrl, alt]}
  - key: {key: "s", mods: [ctrl, alt]}
  - key: {key: "p", mods: [ctrl, alt]}
  - key: {key: "p", mods: [ctrl, alt]}
  - key: {key: "s", mods: [ctrl, alt]}
  - key: {key: "s", mods: [ctrl, alt]}
  - key: {key: "e", mods: [ctrl, alt]}
  - key: {key: "v", mods: [ctrl, alt]}
  - key: {key: "n", mods: [ctrl, alt]}
  - key: {key: "n", mods: [alt]}
  - key: {key: "n", mods: [alt, shift]}
  - sleep_ms: 1000
  - expect_visible: {text: "NORMAL", timeout_ms: 8000}
  - expect_count: {text: "e2esh · home", min: 3, timeout_ms: 8000}
  - expect_visible: {text: "WORKSPACES"}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
