name: glitch_hunt_mode_machine
# Escape chains out of every mode and overlay, double-opens, rapid transitions —
# and after each, the statusbar must read NORMAL again (the invariant this spec
# used to state only in a comment).
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30"]
spawn:
  - sh
  - -c
  - |
    # A fixture repo with pinned dates so its hashes, ages and branch names are
    # the same on every machine (the panel renders them). thegn runs in it.
    set -e
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 1500
  max_settle_ms: 6000
steps:
  # Startup: the statusbar mode and the pane's (fixed, `$ `) prompt.
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - key: {key: "space", mods: [ctrl]}
  - expect_visible: {text: "jump", timeout_ms: 5000}
  - key: {key: "space", mods: [ctrl]}
  - key: {key: "escape"}
  - sleep_ms: 120
  - key: {key: "escape"}
  - sleep_ms: 120
  - expect_not_visible: {text: "jump", timeout_ms: 5000}
  - expect_visible: {text: "NORMAL"}
  - key: {key: "e", mods: [ctrl, alt]}
  - key: {key: "v", mods: [ctrl, alt]}
  - key: {key: "e", mods: [ctrl, alt]}
  - key: {key: "n", mods: [ctrl, alt]}
  - expect_visible: {text: "NORMAL", timeout_ms: 5000}
  - expect_not_visible: {text: "EMACS"}
  - expect_not_visible: {text: "VIM NORMAL"}
  - key: {key: "g", mods: [ctrl]}
  - key: {key: "g", mods: [ctrl]}
  - key: {key: "g", mods: [ctrl]}
  - key: {key: "g", mods: [ctrl]}
  - expect_not_visible: {text: "LOCKED", timeout_ms: 5000}
  - key: {key: "/", mods: [ctrl, alt]}
  - key: {key: "escape"}
  - sleep_ms: 120
  - key: {key: "escape"}
  - sleep_ms: 120
  - key: {key: "s", mods: [alt]}
  - key: {key: "escape"}
  - sleep_ms: 120
  - key: {key: "p", mods: [ctrl, alt]}
  - key: {key: "p", mods: [ctrl, alt]}
  - sleep_ms: 500
  - expect_visible: {text: "NORMAL", timeout_ms: 5000}
  - expect_visible: {text: "Ctrl g lock", timeout_ms: 5000}
  - expect_visible: {regex: "│\\$ "}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
