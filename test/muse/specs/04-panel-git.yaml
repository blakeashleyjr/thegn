name: panel_git
# The Git tab: open the panel, FOCUS it (Ctrl-Right — opening alone leaves the
# keys in the shell), walk the accordion, and check each section's keyhints
# and content. Close and reopen.
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30", "160x40"]
spawn:
  - sh
  - -c
  - |
    # A fixture repo with pinned dates so its hashes, ages and branch names are
    # the same on every machine (the panel renders them). thegn runs in it.
    set -e
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
snapshot_defaults:
  kind: text
  masks:
    # The statusbar after the mode word: transient status messages have a
    # TTL (and push the keyhints around), so only the mode is compared.
    - {content: "(?m)^  (NORMAL|EMACS|VIM NORMAL) +\\?.*$"}
  normalize:
    # relative ages in the git panel ("1s", "6y") drift with the wall clock
    - {re: "\\b[0-9]+(s|m|h|d|w|mo|y)\\b", replace: "<age>"}
steps:
  # Startup: the statusbar mode and the pane's (fixed, `$ `) prompt.
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  # Hydration landed: the git panel's status line (panel is open by default).
  - expect_visible: {text: "working tree clean", timeout_ms: 15000}
  # The commit/branch fan-out lands after status: wait for the hash.
  - expect_visible: {regex: "2 commits +[0-9a-f]{7} init", timeout_ms: 15000}
  # Focus the panel; the first section (changes) shows its keyhints.
  - key: {key: "right", mods: [ctrl]}
  - sleep_ms: 300
  - expect_visible: {text: "1 changes"}
  # Digits jump to a section header, Enter opens it. Commits has a single
  # commit, so Enter drills straight into its file list (blame/open hints);
  # branches shows `main` with its checkout hint.
  - key: {key: "2"}
  - key: {key: "enter"}
  - expect_visible: {text: "blame", timeout_ms: 5000}
  - expect_visible: {regex: "README"}
  - key: {key: "3"}
  - key: {key: "enter"}
  - expect_visible: {regex: "\\* main", timeout_ms: 5000}
  - expect_visible: {text: "checkout"}
  - snapshot: {name: branches}
  - key: {key: "1"}
  - key: {key: "enter"}
  - sleep_ms: 300
  # Close the panel: the git sections disappear; reopen: they're back.
  - key: {key: "p", mods: [ctrl, alt]}
  - expect_not_visible: {text: "2 commits", timeout_ms: 5000}
  - key: {key: "p", mods: [ctrl, alt]}
  - expect_visible: {text: "2 commits", timeout_ms: 5000}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
