name: panel_git
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30", "160x40"]
spawn: ["thegn"]
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
steps:
  - expect_visible: {regex: "thegn|thegn|\\$|>", timeout_ms: 20000}
  # Exit the dashboard tile to access the Work tab.
  - key: {key: q}
  - sleep_ms: 200
  # Open the panel
  - key: {key: p, mods: [ctrl, alt]}
  - sleep_ms: 200
  # Navigate down through sections
  - key: {key: j}
  - key: {key: j}
  - sleep_ms: 100
  # Navigate back up
  - key: {key: k}
  - key: {key: k}
  # Jump to Git tab (already default, ensure we're on tab 1)
  - key: {key: "1", mods: [alt]}
  - sleep_ms: 100
  # Jump to Work tab
  - key: {key: "2", mods: [alt]}
  - sleep_ms: 100
  # Jump to System tab
  - key: {key: "3", mods: [alt]}
  - sleep_ms: 100
  # Close panel
  - key: {key: p, mods: [ctrl, alt]}
  - sleep_ms: 100
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
