name: pins
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30"]
spawn: ["thegn"]
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
steps:
  - expect_visible: {regex: "thegn|thegn|\\$|>", timeout_ms: 20000}
  # Exit the dashboard tile to access the Work tab.
  - key: {key: q}
  - sleep_ms: 200
  # Show the pin strip (Ctrl+Alt+B)
  - key: {key: b, mods: [ctrl, alt]}
  - sleep_ms: 200
  # Grow the strip
  - key: {key: "]", mods: [ctrl, alt]}
  - sleep_ms: 100
  # Shrink the strip back
  - key: {key: "[", mods: [ctrl, alt]}
  - sleep_ms: 100
  # Hide the strip
  - key: {key: b, mods: [ctrl, alt]}
  - sleep_ms: 100
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
