name: resurrect
# Session resurrection: a second launch against the same state dir brings the
# tab layout back (two tabs), on the in-process pane route. The spawn runs
# thegn twice; the spec drives the first to a clean quit and then asserts on
# the second's first frame.
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30"]
spawn:
  - sh
  - -c
  - |
    # A fixture repo with pinned dates so its hashes, ages and branch names are
    # the same on every machine (the panel renders them). thegn runs in it.
    set -e
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    # Two launches against the same state dir: the second resurrects.
    thegn
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 12000
steps:
  # Startup: the statusbar mode and the pane's (fixed, `$ `) prompt.
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - key: {key: "p", mods: [ctrl, alt]}
  - sleep_ms: 30
  - expect_not_visible: {text: "2 commits", timeout_ms: 5000}
  - key: {key: "t", mods: [alt]}
  - sleep_ms: 30
  - expect_visible: {regex: "home +1 +2( |$)", timeout_ms: 10000}
  # The new tab's shell must be up before typing (keys during bring-up are
  # dropped by design).
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - write: "echo marker-before-quit\n"
  - expect_visible: {regex: "│marker-before-quit", timeout_ms: 8000}
  - key: {key: "q", mods: [ctrl]}
  - sleep_ms: 30
  # The second instance: the pane is a fresh shell (the marker is gone) and
  # the tab layout is back.
  - expect_not_visible: {text: "marker-before-quit", timeout_ms: 20000}
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "home +1 +2( |$)", timeout_ms: 15000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - key: {key: "q", mods: [ctrl]}
  - sleep_ms: 30
  - expect_exit: {code: 0, timeout_ms: 10000}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
