name: glitch_hunt_tab_worktree
# Tabs under stress: several new tabs, rapid navigation, boundary clamping,
# repeated close-and-cancel of the root worktree, and the strip-overflow edge —
# with the panel closed the strip has room, so the tab COUNT is asserted
# exactly (a `\b4\b` chip), not merely "something is on screen".
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30"]
spawn:
  - sh
  - -c
  - |
    # A fixture repo with pinned dates so its hashes, ages and branch names are
    # the same on every machine (the panel renders them). thegn runs in it.
    set -e
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 1500
  max_settle_ms: 6000
steps:
  # Startup: the statusbar mode and the pane's (fixed, `$ `) prompt.
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - key: {key: "p", mods: [ctrl, alt]}
  - sleep_ms: 30
  - expect_not_visible: {text: "2 commits", timeout_ms: 5000}
  - key: {key: "t", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "t", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "t", mods: [alt]}
  - sleep_ms: 30
  - expect_visible: {regex: "home +1 +2 +3 +4( |$)", timeout_ms: 12000}
  - key: {key: "right", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "right", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "right", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "right", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "right", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "right", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "left", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "left", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "left", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "left", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "left", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "left", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "left", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "left", mods: [alt]}
  - sleep_ms: 30
  - sleep_ms: 500
  - expect_visible: {regex: "home +1 +2 +3 +4( |$)"}
  - expect_count: {regex: "\\b4\\b", min: 1}
  - key: {key: "x", mods: [alt, shift]}
  - sleep_ms: 30
  - expect_visible: {text: "Root workspace cannot be deleted", timeout_ms: 5000}
  - key: {key: "escape"}
  - sleep_ms: 120
  - key: {key: "x", mods: [alt, shift]}
  - sleep_ms: 30
  - expect_visible: {text: "Root workspace cannot be deleted", timeout_ms: 5000}
  - key: {key: "escape"}
  - sleep_ms: 120
  - key: {key: "x", mods: [alt, shift]}
  - sleep_ms: 30
  - expect_visible: {text: "Root workspace cannot be deleted", timeout_ms: 5000}
  - key: {key: "escape"}
  - sleep_ms: 120
  - sleep_ms: 300
  - expect_visible: {regex: "home +1 +2 +3 +4( |$)"}
  # Overflow edge: open the panel — the strip shrinks and drops chips it can't
  # fit (no indicator), but every tab still exists: closing the panel shows 4.
  - key: {key: "p", mods: [ctrl, alt]}
  - sleep_ms: 30
  - sleep_ms: 600
  - key: {key: "p", mods: [ctrl, alt]}
  - sleep_ms: 30
  - expect_visible: {regex: "home +1 +2 +3 +4( |$)", timeout_ms: 5000}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
