name: tabs
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30"]
spawn: ["thegn"]
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
steps:
  - expect_visible: {regex: "thegn|thegn|\\$|>", timeout_ms: 20000}
  # Exit the dashboard tile to access the Work tab.
  - key: {key: q}
  - sleep_ms: 200
  # Open a second tab (new worktree tab)
  - key: {key: t, mods: [alt]}
  - sleep_ms: 300
  # Open a third tab
  - key: {key: t, mods: [alt]}
  - sleep_ms: 300
  # Navigate prev / next
  - key: {key: left, mods: [alt]}
  - sleep_ms: 100
  - key: {key: right, mods: [alt]}
  - sleep_ms: 100
  # Close current tab (expect confirm dialog for worktree)
  - key: {key: x, mods: [alt]}
  - sleep_ms: 300
  # Cancel the close
  - key: {key: escape}
  - sleep_ms: 100
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
