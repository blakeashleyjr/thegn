name: tabs
# Tabs within a worktree: Alt-t adds (tabbar shows 1 2 3), Alt-Left/Right
# move, Alt-x closes the current one (back to two). The panel is closed first:
# with it open at 100 columns the tab strip is ~22 columns and chips that
# don't fit are dropped from the strip without an overflow indicator (the
# tab still exists) — see 24-glitch-hunt-tab-worktree for that edge.
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30"]
spawn:
  - sh
  - -c
  - |
    # A fixture repo with pinned dates so its hashes, ages and branch names are
    # the same on every machine (the panel renders them). thegn runs in it.
    set -e
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
steps:
  # Startup: the statusbar mode and the pane's (fixed, `$ `) prompt.
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - key: {key: "p", mods: [ctrl, alt]}
  - expect_not_visible: {text: "2 commits", timeout_ms: 5000}
  - key: {key: "t", mods: [alt]}
  - expect_visible: {regex: "home +1 +2", timeout_ms: 8000}
  - key: {key: "t", mods: [alt]}
  - expect_visible: {regex: "home +1 +2 +3", timeout_ms: 8000}
  - key: {key: "left", mods: [alt]}
  - key: {key: "right", mods: [alt]}
  - sleep_ms: 300
  - expect_visible: {regex: "home +1 +2 +3"}
  - key: {key: "x", mods: [alt]}
  - expect_not_visible: {regex: "home +1 +2 +3", timeout_ms: 8000}
  - expect_visible: {regex: "home +1 +2", timeout_ms: 5000}
  # Two presses back to back, the second during the first tab's bring-up:
  # both tabs must land.
  - key: {key: "t", mods: [alt]}
  - key: {key: "t", mods: [alt]}
  - expect_visible: {regex: "home +1 +2 +3 +4", timeout_ms: 10000}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
