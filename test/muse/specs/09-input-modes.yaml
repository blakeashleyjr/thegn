name: input_modes
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30"]
spawn: ["thegn"]
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
steps:
  - expect_visible: {regex: "thegn|thegn|\\$|>", timeout_ms: 20000}
  # Exit the dashboard tile to access the Work tab.
  - key: {key: q}
  - sleep_ms: 200
  # Key-lock mode (Ctrl+G)
  - key: {key: g, mods: [ctrl]}
  - sleep_ms: 100
  # Unlock
  - key: {key: g, mods: [ctrl]}
  - sleep_ms: 100
  # Emacs mode
  - key: {key: e, mods: [ctrl, alt]}
  - sleep_ms: 100
  # Back to normal
  - key: {key: n, mods: [ctrl, alt]}
  - sleep_ms: 100
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
