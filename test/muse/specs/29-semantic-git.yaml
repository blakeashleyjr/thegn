name: semantic_git
# Semantic git layer (items 309/311/313/317): the changes section shows an
# entity impact line and per-file entity headers, derived by tree-sitter from a
# dirty, entity-bearing file. The fixture is built inline in `spawn`: a fresh
# git repo under the case tmp dir with one committed Rust fn whose body is then
# edited, before exec'ing thegn in that worktree.
#
# Assertion-based: the exact entity text must be on screen.
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["120x36"]
spawn:
  - sh
  - -lc
  - |
    repo="$XDG_STATE_HOME/wt"
    mkdir -p "$repo"
    cd "$repo"
    git init -q -b main
    git config user.email t@t.t
    git config user.name t
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'fn greet() -> u8 {\n    1\n}\n' > lib.rs
    git add .
    git commit -qm init
    printf 'fn greet() -> u8 {\n    42\n}\n' > lib.rs
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2500
  max_settle_ms: 12000
steps:
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  # The panel is open by default; wait for git hydration, then focus it and
  # select the changed file so both the impact line (item 313) and its
  # per-file entity header (item 311) render.
  - expect_visible: {text: "1 changes", timeout_ms: 15000}
  - expect_visible: {text: "lib.rs", timeout_ms: 15000}
  - key: {key: right, mods: [ctrl]}
  - sleep_ms: 300
  - key: {key: enter}
  - sleep_ms: 500
  # The impact line summarizes the entity-level change (item 313)…
  - expect_visible: {regex: "semantic.*1 file", timeout_ms: 6000}
  # …and the selected file shows its touched entity (item 311).
  - expect_visible: {regex: "fn greet", timeout_ms: 6000}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
