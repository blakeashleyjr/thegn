name: glitch_hunt_panel_accordion
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30", "160x40"]
spawn: ["thegn"]
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
steps:
  - begin_step: "startup"
  - expect_visible: {regex: "thegn|thegn|\\$|>", timeout_ms: 20000}
  # Exit the dashboard tile to access the Work tab.
  - key: {key: q}
  - sleep_ms: 200
  # ── Panel tab cycling must not corrupt layout ─────────────────────────────────
  - begin_step: "panel tab cycling"
  - key: {key: p, mods: [ctrl, alt]}
  - sleep_ms: 150
  - key: {key: "1", mods: [alt]}
  - sleep_ms: 80
  - key: {key: "2", mods: [alt]}
  - sleep_ms: 80
  - key: {key: "3", mods: [alt]}
  - sleep_ms: 80
  # Cycle back to 1 without closing
  - key: {key: "1", mods: [alt]}
  - sleep_ms: 80
  # ── Panel navigation: section scroll must not overflow ────────────────────────
  - begin_step: "panel section overflow scroll"
  - key: {key: "1", mods: [alt]}
  - sleep_ms: 80
  # Scroll way past the bottom
  - key: {key: j}
  - key: {key: j}
  - key: {key: j}
  - key: {key: j}
  - key: {key: j}
  - key: {key: j}
  - key: {key: j}
  - key: {key: j}
  - key: {key: j}
  - key: {key: j}
  - sleep_ms: 100
  # Scroll back to top
  - key: {key: g}
  - sleep_ms: 80
  # Scroll before top (should clamp)
  - key: {key: k}
  - key: {key: k}
  - key: {key: k}
  - sleep_ms: 80
  # ── Panel accordion width cycling ────────────────────────────────────────────
  - begin_step: "panel width cycling"
  - key: {key: e}
  - sleep_ms: 80
  - key: {key: e}
  - sleep_ms: 80
  - key: {key: e}
  - sleep_ms: 80
  # ── Panel + pane splits: layout must not overlap ──────────────────────────────
  - begin_step: "panel with splits"
  - key: {key: p, mods: [ctrl, alt]}
  - sleep_ms: 80
  # Now open panel + add a split
  - key: {key: p, mods: [ctrl, alt]}
  - sleep_ms: 120
  - key: {key: n, mods: [alt]}
  - sleep_ms: 150
  - resize: "80x24"
  - sleep_ms: 80
  - resize: "100x30"
  - sleep_ms: 80
  - key: {key: p, mods: [ctrl, alt]}
  - sleep_ms: 80
  # ── Section expand/collapse boundary ─────────────────────────────────────────
  - begin_step: "section expand collapse"
  - key: {key: p, mods: [ctrl, alt]}
  - sleep_ms: 120
  - key: {key: enter}
  - sleep_ms: 80
  - key: {key: enter}
  - sleep_ms: 80
  # Rapid expand/collapse
  - key: {key: enter}
  - key: {key: enter}
  - key: {key: enter}
  - key: {key: enter}
  - sleep_ms: 100
  - key: {key: p, mods: [ctrl, alt]}
  - sleep_ms: 80
  - begin_step: "verify no errors"
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
