name: onboarding
# First-run welcome tour, happy path: a fresh state dir (no `onboarding_done`
# marker) opens the tour, every chapter renders at 80x24 and 100x30, the theme
# pick reaches the finish diff, the key drill reacts to the real chord, and
# Enter on the finish screen saves and returns to a live shell.
# `just e2e` exports THEGN_SKIP_ONBOARDING=1 for every other spec; this one
# unsets it. Kitty profile: Esc/Tab/Alt chords are unambiguous CSI-u there.
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [kitty]
  sizes: ["80x24", "100x30"]
spawn:
  - sh
  - -c
  - |
    set -e
    unset THEGN_SKIP_ONBOARDING
    # Own config dir, so the tour's write lands in the case dir, never in the
    # shared e2e config. Re-assert the e2e sandbox/media settings it bypasses.
    export XDG_CONFIG_HOME="$XDG_STATE_HOME/cfg"
    mkdir -p "$XDG_CONFIG_HOME/thegn"
    printf '[sandbox]\nbackend = "none"\n[media]\nenabled = false\n' > "$XDG_CONFIG_HOME/thegn/config.toml"
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
steps:
  # 1 Welcome
  - expect_visible: {text: "Every git worktree a tab.", timeout_ms: 20000}
  - expect_visible: {text: "1/8"}
  - key: {key: "enter"}
  # 2 Workspace: the diagram, and up/down walks its parts.
  - expect_visible: {text: "the workspace model", timeout_ms: 5000}
  - expect_visible: {text: "SIDEBAR"}
  - key: {key: "down"}
  - expect_visible: {text: "A worktree is a branch", timeout_ms: 5000}
  - key: {key: "enter"}
  # 3 Look: one step down the list is `storm`.
  - expect_visible: {text: "pick your look", timeout_ms: 5000}
  - key: {key: "down"}
  - sleep_ms: 50
  - key: {key: "enter"}
  # 4 Sandbox: the tier table and the plain statement of what is not protected.
  - expect_visible: {text: "sandboxes, honestly", timeout_ms: 5000}
  - expect_visible: {text: "outside worktree"}
  - expect_visible: {text: "No tier stops a kernel exploit"}
  - key: {key: "enter"}
  # 5 Agents (whatever is on PATH here; nothing is picked).
  - expect_visible: {text: "your coding agent", timeout_ms: 5000}
  - key: {key: "enter"}
  # 6 Remote
  - expect_visible: {text: "never asks for tokens", timeout_ms: 5000}
  - key: {key: "enter"}
  # 7 Keys: the real new-worktree chord reacts on the practice diagram.
  - expect_visible: {text: "keys you'll use daily", timeout_ms: 5000}
  - key: {key: "q", mods: [alt]}
  - expect_visible: {text: "That was Alt-q", timeout_ms: 5000}
  - key: {key: "w", mods: [alt]}
  - expect_visible: {text: "A new worktree: its own branch", timeout_ms: 5000}
  - key: {key: "enter"}
  # 8 Finish: the diff names the one change; Enter saves it.
  - expect_visible: {text: "theme.preset", timeout_ms: 5000}
  - expect_visible: {text: "+ storm"}
  - key: {key: "enter"}
  - expect_visible: {text: "saving 1 setting", timeout_ms: 5000}
  - expect_not_visible: {text: "keys you'll use daily", timeout_ms: 5000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - expect_visible: {text: "NORMAL"}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|subtract with overflow|index out of bounds|save failed"
