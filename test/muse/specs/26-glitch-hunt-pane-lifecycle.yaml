name: glitch_hunt_pane_lifecycle
# Pane lifecycle: split past the limit, zoom, split/close cycles, closing the
# last pane of a tab, extreme resizes — asserting the pane count the tabbar
# and frames imply, not merely survival.
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30"]
spawn:
  - sh
  - -c
  - |
    # A fixture repo with pinned dates so its hashes, ages and branch names are
    # the same on every machine (the panel renders them). thegn runs in it.
    set -e
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 1500
  max_settle_ms: 6000
steps:
  # Startup: the statusbar mode and the pane's (fixed, `$ `) prompt.
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - key: {key: "p", mods: [ctrl, alt]}
  - sleep_ms: 30
  - expect_not_visible: {text: "2 commits", timeout_ms: 5000}
  - key: {key: "n", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "n", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "n", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "n", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "n", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "n", mods: [alt]}
  - sleep_ms: 30
  - sleep_ms: 1500
  - expect_visible: {text: "NORMAL", timeout_ms: 8000}
  - expect_count: {text: "e2esh · home", min: 2}
  - key: {key: "z", mods: [ctrl, alt]}
  - sleep_ms: 30
  - key: {key: "z", mods: [ctrl, alt]}
  - sleep_ms: 30
  - key: {key: "z", mods: [ctrl, alt]}
  - sleep_ms: 30
  - sleep_ms: 400
  - key: {key: "n", mods: [alt]}
  - sleep_ms: 30
  - sleep_ms: 400
  - key: {key: "x", mods: [alt]}
  - sleep_ms: 30
  - sleep_ms: 400
  - key: {key: "n", mods: [alt]}
  - sleep_ms: 30
  - sleep_ms: 400
  - key: {key: "x", mods: [alt]}
  - sleep_ms: 30
  - sleep_ms: 400
  - key: {key: "n", mods: [alt]}
  - sleep_ms: 30
  - sleep_ms: 400
  - key: {key: "x", mods: [alt]}
  - sleep_ms: 30
  - sleep_ms: 400
  - expect_visible: {text: "NORMAL", timeout_ms: 5000}
  - resize: "20x5"
  - sleep_ms: 800
  - resize: "300x80"
  - sleep_ms: 800
  - resize: "100x30"
  - sleep_ms: 1200
  - expect_visible: {text: "NORMAL", timeout_ms: 8000}
  - expect_visible: {regex: "│\\$ "}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
