name: glitch_hunt_focus
# Focus boundaries: rapid focus cycling across splits, zoom while focused,
# panel focus, the key-lock boundary, and typing while the SIDEBAR is focused —
# that text must never reach a pane (the invariant this spec used to state only
# in a comment).
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30"]
spawn:
  - sh
  - -c
  - |
    # A fixture repo with pinned dates so its hashes, ages and branch names are
    # the same on every machine (the panel renders them). thegn runs in it.
    set -e
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 1500
  max_settle_ms: 6000
steps:
  # Startup: the statusbar mode and the pane's (fixed, `$ `) prompt.
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - key: {key: "p", mods: [ctrl, alt]}
  - expect_not_visible: {text: "2 commits", timeout_ms: 5000}
  - key: {key: "n", mods: [alt]}
  - expect_count: {text: "e2esh · home", min: 2, timeout_ms: 8000}
  - key: {key: "up", mods: [alt]}
  - key: {key: "down", mods: [alt]}
  - key: {key: "up", mods: [alt]}
  - key: {key: "down", mods: [alt]}
  - key: {key: "up", mods: [alt]}
  - key: {key: "down", mods: [alt]}
  - key: {key: "up", mods: [alt]}
  - key: {key: "down", mods: [alt]}
  - key: {key: "z", mods: [ctrl, alt]}
  - key: {key: "z", mods: [ctrl, alt]}
  - key: {key: "z", mods: [ctrl, alt]}
  - sleep_ms: 500
  - expect_not_visible: {text: "ZOOM", timeout_ms: 5000}
  # Sidebar focus: letters are sidebar keys, not shell input.
  - key: {key: "s", mods: [alt]}
  - expect_visible: {text: "open / fold", timeout_ms: 5000}
  - write: "zzqq"
  - sleep_ms: 400
  - expect_not_visible: {regex: "│\\$ .*zzqq"}
  - key: {key: "escape"}
  - sleep_ms: 120
  - expect_visible: {text: "Ctrl g lock", timeout_ms: 5000}
  # Key-lock boundary: locked → Alt-s must NOT focus the sidebar.
  - key: {key: "g", mods: [ctrl]}
  - expect_visible: {text: "LOCKED", timeout_ms: 5000}
  - key: {key: "s", mods: [alt]}
  - sleep_ms: 400
  - expect_not_visible: {text: "open / fold"}
  - key: {key: "g", mods: [ctrl]}
  - expect_not_visible: {text: "LOCKED", timeout_ms: 5000}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
