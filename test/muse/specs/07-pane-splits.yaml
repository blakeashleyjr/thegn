name: pane_splits
# Splits: Alt-n splits down (two pane frames), Alt-Shift-n splits right, the
# focus tour visits them, zoom maximizes then fullscreens then restores.
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30", "160x40"]
spawn:
  - sh
  - -c
  - |
    # A fixture repo with pinned dates so its hashes, ages and branch names are
    # the same on every machine (the panel renders them). thegn runs in it.
    set -e
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
steps:
  # Startup: the statusbar mode and the pane's (fixed, `$ `) prompt.
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - key: {key: "p", mods: [ctrl, alt]}
  - sleep_ms: 30
  - sleep_ms: 300
  - key: {key: "n", mods: [alt]}
  - sleep_ms: 30
  - expect_count: {text: "e2esh · home", min: 2, timeout_ms: 8000}
  - key: {key: "n", mods: [alt, shift]}
  - sleep_ms: 30
  - expect_count: {text: "e2esh · home", min: 3, timeout_ms: 8000}
  # Focus tour (Alt-arrows) must not lose any pane.
  - key: {key: "left", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "right", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "up", mods: [alt]}
  - sleep_ms: 30
  - key: {key: "down", mods: [alt]}
  - sleep_ms: 30
  - sleep_ms: 300
  - expect_count: {text: "e2esh · home", min: 3}
  # Zoom: maximize → fullscreen → restore.
  - key: {key: "z", mods: [ctrl, alt]}
  - sleep_ms: 30
  - expect_visible: {text: "MAX", timeout_ms: 5000}
  - key: {key: "z", mods: [ctrl, alt]}
  - sleep_ms: 30
  - expect_visible: {text: "ZOOM", timeout_ms: 5000}
  - key: {key: "z", mods: [ctrl, alt]}
  - sleep_ms: 30
  - expect_not_visible: {text: "ZOOM", timeout_ms: 5000}
  - expect_count: {text: "e2esh · home", min: 3, timeout_ms: 5000}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
