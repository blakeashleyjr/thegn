name: pane_splits
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30", "80x24"]
spawn: ["thegn"]
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
steps:
  - expect_visible: {regex: "thegn|thegn|\\$|>", timeout_ms: 20000}
  # Exit the dashboard tile to access the Work tab.
  - key: {key: q}
  - sleep_ms: 200
  # Split horizontally (new pane below)
  - key: {key: n, mods: [alt]}
  - sleep_ms: 200
  # Split vertically (new pane right)
  - key: {key: n, mods: [alt, shift]}
  - sleep_ms: 200
  # Focus tour: move between panes
  - key: {key: left, mods: [alt]}
  - sleep_ms: 80
  - key: {key: right, mods: [alt]}
  - sleep_ms: 80
  - key: {key: up, mods: [alt]}
  - sleep_ms: 80
  - key: {key: down, mods: [alt]}
  - sleep_ms: 80
  # Zoom active pane
  - key: {key: z, mods: [ctrl, alt]}
  - sleep_ms: 100
  # Unzoom
  - key: {key: z, mods: [ctrl, alt]}
  - sleep_ms: 100
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
