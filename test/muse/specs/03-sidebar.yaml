name: sidebar
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30", "160x40"]
spawn: ["thegn"]
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
steps:
  - begin_step: "startup"
  - expect_visible: {regex: "thegn|thegn|\\$|>", timeout_ms: 20000}
  # Exit the dashboard tile to access the Work tab.
  - key: {key: q}
  - sleep_ms: 200
  - begin_step: "focus sidebar"
  - key: {key: s, mods: [alt]}
  - sleep_ms: 100
  - begin_step: "navigate sidebar"
  - key: {key: j}
  - key: {key: j}
  - key: {key: j}
  - sleep_ms: 100
  - begin_step: "unfocus sidebar"
  - key: {key: escape}
  - sleep_ms: 100
  # The sidebar is showing: its section header proves it, and asserting that
  # first keeps the hide assertion below from passing vacuously.
  - expect_visible: {text: "WORKSPACES", timeout_ms: 3000}
  - begin_step: "hide sidebar"
  - key: {key: s, mods: [ctrl, alt]}
  - sleep_ms: 100
  # Confirm no sidebar CONTENT is visible when hidden.
  #
  # Assert on a sidebar section header, not on the word "sidebar". The bare word
  # is not sidebar content at all — no repo or worktree row contains it — but it
  # IS the `hint:` label of the toggle-sidebar / focus-sidebar actions
  # (`keymap_specs.rs`), which the statusbar key-hint row renders. That made the
  # old assertion environment-dependent: the hint row's budget is whatever the
  # system-metrics segment leaves, so on a cloud runner (no battery, no thermal
  # sensors, idle network) there is room for it and on a developer laptop there
  # is not. It failed at 160x40 on GitHub-hosted runners and nowhere else, and
  # probes on the runner confirmed the word was present once, before any hide,
  # and never adjacent to a chord — i.e. the hint label, not the sidebar.
  - expect_not_visible: {text: "WORKSPACES", timeout_ms: 10000}
  - begin_step: "restore sidebar"
  - key: {key: s, mods: [ctrl, alt]}
  - sleep_ms: 100
  - begin_step: "verify no errors"
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
