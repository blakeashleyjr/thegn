name: sidebar
# Sidebar: cycle it (full → rail → hidden → full), then focus it and walk it.
# Asserts on the WORKSPACES header (not the word "sidebar", which also appears
# in keyhints — the trap this spec fell into once).
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30", "160x40"]
spawn:
  - sh
  - -c
  - |
    # A fixture repo with pinned dates so its hashes, ages and branch names are
    # the same on every machine (the panel renders them). thegn runs in it.
    set -e
    repo="$XDG_STATE_HOME/repo"
    mkdir -p "$repo"; cd "$repo"
    git init -q -b main
    git config user.email e2e@example.invalid; git config user.name e2e
    export GIT_AUTHOR_DATE=2020-01-01T00:00:00Z GIT_COMMITTER_DATE=2020-01-01T00:00:00Z
    printf 'hello\n' > README.md
    git add -A; git commit -q -m init
    exec thegn
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
snapshot_defaults:
  kind: text
  masks:
    # The statusbar after the mode word: transient status messages have a
    # TTL (and push the keyhints around), so only the mode is compared.
    - {content: "(?m)^  (NORMAL|EMACS|VIM NORMAL) +\\?.*$"}
  normalize:
    # relative ages in the git panel ("1s", "6y") drift with the wall clock
    - {re: "\\b[0-9]+(s|m|h|d|w|mo|y)\\b", replace: "<age>"}
steps:
  # Startup: the statusbar mode and the pane's (fixed, `$ `) prompt.
  - expect_visible: {text: "NORMAL", timeout_ms: 20000}
  - expect_visible: {regex: "│\\$ ", timeout_ms: 20000}
  - expect_visible: {text: "WORKSPACES"}
  # The toggle is a three-state cycle: full → rail (just the repo initial,
  # no header) → hidden (pane frame at column 0) → full.
  - key: {key: "s", mods: [ctrl, alt]}
  - expect_not_visible: {text: "WORKSPACES", timeout_ms: 5000}
  - expect_visible: {regex: "^ +r +REPO", timeout_ms: 5000}
  - key: {key: "s", mods: [ctrl, alt]}
  - expect_visible: {regex: "^╭─ e2esh", timeout_ms: 5000}
  - key: {key: "s", mods: [ctrl, alt]}
  - expect_visible: {text: "WORKSPACES", timeout_ms: 5000}
  - expect_not_visible: {regex: "^╭─ e2esh", timeout_ms: 5000}
  # Focus the sidebar (Alt-s) and walk it; the sidebar keyhints take over
  # the statusbar and the row cursor renders.
  - key: {key: "s", mods: [alt]}
  - expect_visible: {text: "open / fold", timeout_ms: 5000}
  - key: {key: "j"}
  - key: {key: "j"}
  - key: {key: "k"}
  - sleep_ms: 300
  - snapshot: {name: focused}
  # Escape returns focus to the pane (its keyhints are back).
  - key: {key: "escape"}
  - sleep_ms: 120
  - expect_visible: {text: "Ctrl g lock", timeout_ms: 5000}
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
