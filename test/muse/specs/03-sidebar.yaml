name: sidebar
case_tmp_env: XDG_STATE_HOME
matrix:
  profiles: [xterm]
  sizes: ["100x30", "160x40"]
spawn: ["thegn"]
env:
  XDG_STATE_HOME: "{case_tmp}"
  THEGN_LOG: warn
  MUSE_READY: "1"
  TERM: xterm-256color
sync:
  quiet_window_ms: 2000
  max_settle_ms: 10000
steps:
  - begin_step: "startup"
  - expect_visible: {regex: "thegn|thegn|\\$|>", timeout_ms: 20000}
  # Exit the dashboard tile to access the Work tab.
  - key: {key: q}
  - sleep_ms: 200
  - begin_step: "focus sidebar"
  - key: {key: s, mods: [alt]}
  - sleep_ms: 100
  - begin_step: "navigate sidebar"
  - key: {key: j}
  - key: {key: j}
  - key: {key: j}
  - sleep_ms: 100
  - begin_step: "unfocus sidebar"
  - key: {key: escape}
  - sleep_ms: 100
  - begin_step: "hide sidebar"
  - key: {key: s, mods: [ctrl, alt]}
  - sleep_ms: 100
  # Confirm no sidebar content visible when hidden.
  #
  # The deadline is how long the hide repaint is allowed to take, not a
  # tightness knob: expect_not_visible polls until the locator stops matching
  # and fails only if it STILL matches at the deadline, so a generous window
  # cannot make a genuinely-unhidden sidebar pass — it only tolerates a slow
  # frame. Matched to the spec's own max_settle_ms.
  #
  # History: this was 200ms and failed on GitHub-hosted runners at 160x40 only
  # (the largest grid = the most cells to compose and diff) while passing at
  # 100x30 there. It could not be reproduced locally — the full suite passes
  # 60/60 with the identical `--workers 2` command — which fits the runner
  # being 2 vCPU with two compositors and two muse drivers contending for them.
  # If this ever fails again at a size that renders promptly elsewhere, suspect
  # the hide path rather than the clock.
  - expect_not_visible: {text: "sidebar", timeout_ms: 10000}
  - begin_step: "restore sidebar"
  - key: {key: s, mods: [ctrl, alt]}
  - sleep_ms: 100
  - begin_step: "verify no errors"
  - check_file:
      path: "{case_tmp}/thegn/logs/thegn.log"
      reject_re: "ERROR|thread '.*' panicked|WARN.*OOM|WARN.*corrupt|subtract with overflow|index out of bounds"
